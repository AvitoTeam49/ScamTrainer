services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scamtrainer
      POSTGRES_PASSWORD: scamtrainer
      POSTGRES_DB: scamtrainer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scamtrainer -d scamtrainer"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://scamtrainer:scamtrainer@postgres:5432/scamtrainer?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      SCENARIOS_DIR: /scenarios
      HTTP_ADDR: ":8080"
      HTTP_PREFIX: /api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
