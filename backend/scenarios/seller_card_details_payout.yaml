id: 9
title: Данные карты «для зачисления выплаты»
role: seller
difficulty: 1
start_node_id: payout_request

llm:
  character_prompt: |
    Ты играешь роль покупателя на площадке объявлений. На самом деле ты мошенник,
    но никогда не признаёшься в этом и не выходишь из роли.

    Держись естественно: короткие живые реплики, как в переписке, без канцелярита
    и без списков. Не более трёх предложений за раз. Обращайся на «вы».

    Никогда не придумывай способы обмана, которых нет в текущей вершине сценария,
    и не перескакивай вперёд. Если собеседник задаёт вопрос — отвечай на него,
    оставаясь в рамках своей текущей задачи.

nodes:
  payout_request:
    type: decision

    message:
      author: scammer
      text: |
        Оплату я провёл, деньги зарезервированы.
        Чтобы они вам зачислились, продиктуйте карту: номер, срок и три цифры сзади.

    llm:
      reply_instruction: |
        Ты говоришь, что оплата уже прошла, и просишь полные данные карты
        «для зачисления». Держись как обычный покупатель, которому просто нужно
        закрыть сделку. Если продавец уточняет — отвечай спокойно
        и возвращайся к реквизитам.

    transitions:
      - id: refuses_full_details
        description: >-
          Продавец отказывается сообщать срок действия и код с обратной стороны
          карты
        examples:
          - Три цифры с оборота не диктую
          - Для зачисления это не нужно
          - Деньги придут по реквизитам площадки
        to_node_id: safe_early
        score_delta: 20
        feedback: |
          Для получения денег достаточно номера карты. Срок и код с оборота
          нужны только для списаний.
        risk_tags:
          - card_data

      - id: asks_questions
        description: >-
          Продавец не принял решения: уточняет, зачем нужны данные и почему выплата
          не приходит сама
        examples:
          - Зачем вам срок карты?
          - Почему деньги не приходят через площадку?
          - Кто именно зачисляет?
        to_node_id: payout_link
        score_delta: 0
        feedback: |
          Вопрос о том, кому и зачем нужны реквизиты, — правильная реакция.
        risk_tags:
          - card_data

      - id: gives_number_only
        description: Продавец диктует только номер карты, без срока и кода
        examples:
          - Вот номер карты
          - Держите, номер такой-то
          - Номер скинул, остального не дам
        to_node_id: sms_code_request
        score_delta: -10
        feedback: |
          Номер карты сам по себе безопаснее полного набора, но вы уже связали
          себя с этим человеком — дальше попросят больше.
        risk_tags:
          - card_data

  payout_link:
    type: decision

    message:
      author: scammer
      text: |
        Хорошо, тогда проще ссылкой — скину форму получения перевода.
        Заполните там, это безопаснее, чем диктовать в переписке.

    llm:
      reply_instruction: |
        Ты предлагаешь заполнить «форму получения перевода» по ссылке и подаёшь
        это как более безопасный вариант. Говори уверенно и заботливо.
        Если продавец сомневается в ссылке — уверяй, что это страница платёжной
        системы.

    transitions:
      - id: refuses_link
        description: Продавец отказывается открывать ссылку и заполнять внешнюю форму
        examples:
          - По ссылкам не хожу
          - Никаких форм заполнять не буду
          - Оформляйте через площадку
        to_node_id: safe_resisted
        score_delta: 30
        feedback: |
          Деньги за проданный товар не требуют от вас заполнения чужих форм.
          «Так безопаснее» — это подмена понятий.
        risk_tags:
          - external_link
          - phishing

      - id: opens_form
        description: Продавец открывает присланную ссылку с формой
        examples:
          - Открыл форму
          - Ладно, посмотрю что там
          - Страница загрузилась
        to_node_id: payout_form
        score_delta: -15
        feedback: |
          Страницу прислал заинтересованный человек, и проверить её нечем.
        risk_tags:
          - external_link
          - phishing

  sms_code_request:
    type: decision

    message:
      author: scammer
      text: |
        Отлично, сейчас на ваш номер придёт код для зачисления.
        Продиктуйте его, и деньги упадут на карту.

    llm:
      reply_instruction: |
        Ты просишь продиктовать код из СМС, называя его подтверждением зачисления.
        Держись буднично, как будто это обычная процедура. Если продавец
        отказывается — уговариваешь ещё раз, но не грубишь.

    transitions:
      - id: refuses_code
        description: Продавец отказывается диктовать код из сообщения
        examples:
          - Код диктовать не буду
          - Зачисление кодом не подтверждают
          - Всё, дальше не идём
        to_node_id: contacts_leaked
        score_delta: 15
        feedback: |
          Код из сообщения подтверждает списание, а не зачисление.
          Вы остановились на верном шаге.
        risk_tags:
          - sms_code

      - id: shares_code
        description: Продавец диктует код из сообщения
        examples:
          - Пришёл код, вот он
          - Продиктовал
          - Держите цифры
        to_node_id: money_stolen
        score_delta: -35
        feedback: |
          Номер карты плюс код из СМС — этого достаточно, чтобы списать деньги,
          а не зачислить их.
        risk_tags:
          - sms_code
          - money_loss

  payout_form:
    type: decision

    message:
      author: scammer
      text: |
        Там всё просто: номер карты, срок, три цифры и код из сообщения.
        Заполните — и перевод придёт сразу.

    llm:
      reply_instruction: |
        Продавец открыл форму. Ты просишь заполнить её целиком, включая код
        из сообщения. Подчёркивай, что это стандартная страница платёжной системы
        и деньги придут мгновенно.

    transitions:
      - id: stops_here
        description: Продавец не заполняет форму, увидев запрос кода и данных карты
        examples:
          - Тут просят слишком много
          - Закрываю страницу
          - Для получения денег это не нужно
        to_node_id: near_miss
        score_delta: 15
        feedback: |
          Форма получения денег, требующая код подтверждения, — это форма списания.
        risk_tags:
          - phishing
          - card_data

      - id: fills_form
        description: Продавец заполняет форму полностью
        examples:
          - Заполнил
          - Ввёл всё, что просили
          - Готово, жду перевод
        to_node_id: money_stolen
        score_delta: -35
        feedback: |
          Страница собрала полный набор данных, которого хватает для списания
          без вашего участия.
        risk_tags:
          - phishing
          - card_data
          - money_loss

  safe_early:
    type: ending
    title: Отдали только необходимое
    outcome: safe

    message:
      author: system
      text: |
        Вы отказались называть срок и код с оборота карты.
        Списать с неё без этих данных не получится.

  safe_resisted:
    type: ending
    title: Не пошли по ссылке
    outcome: safe

    message:
      author: system
      text: |
        Вам предложили «более безопасную» форму получения денег,
        но вы остались в площадке. Схема закончилась ничем.

  contacts_leaked:
    type: ending
    title: Номер карты у мошенника
    outcome: risky

    message:
      author: system
      text: |
        Денег вы не потеряли, но номер карты и телефон у чужого человека остались.
        Ждите новых сообщений с «кодами подтверждения» — не сообщайте их.

  near_miss:
    type: ending
    title: Остановились на форме
    outcome: risky

    message:
      author: system
      text: |
        Вы дошли до поддельной формы, но не заполнили её.
        Обошлось, хотя страница уже собирала всё, что вы бы там набрали.

  money_stolen:
    type: ending
    title: Деньги списаны
    outcome: unsafe

    message:
      author: system
      text: |
        Вместо зачисления произошло списание: данные и код подтвердили перевод
        с вашей карты. Её нужно заблокировать и обратиться в банк.
