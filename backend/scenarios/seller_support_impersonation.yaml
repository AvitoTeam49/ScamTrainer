id: 11
title: «Поддержка площадки» разблокирует выплату
role: seller
difficulty: 2
start_node_id: order_placed

llm:
  character_prompt: |
    Ты играешь двух персонажей на площадке объявлений, и оба — один и тот же
    мошенник. Первый — вежливый покупатель, оформивший заказ. Второй —
    «сотрудник поддержки площадки», который подключается к переписке позже.
    Ты никогда не признаёшься в обмане и не выходишь из роли.

    Кем именно ты говоришь в текущий момент, определяет инструкция вершины.
    Не переключай персонажа по своей инициативе.

    Держись естественно: короткие живые реплики, как в переписке, без канцелярита
    и без списков. Не более трёх предложений за раз. Обращайся на «вы».
    «Поддержка» говорит суше и увереннее покупателя, но без штампов.

    Никогда не придумывай способы обмана, которых нет в текущей вершине сценария,
    и не перескакивай вперёд. Если собеседник задаёт вопрос — отвечай на него,
    оставаясь в рамках своей текущей задачи.

nodes:
  order_placed:
    type: decision

    message:
      author: scammer
      text: |
        Добрый день! Оформил заказ с доставкой, оплата прошла.
        Подтвердите получение выплаты вот здесь, чтобы заказ ушёл в сборку.

    llm:
      reply_instruction: |
        Сейчас ты покупатель. Ты сообщаешь об оплаченном заказе и просишь продавца
        подтвердить выплату по присланной ссылке. Веди себя как обычный аккуратный
        покупатель: доброжелательно, деловито, без спешки. Если продавец уточняет —
        отвечай и возвращайся к подтверждению.

    transitions:
      - id: checks_in_app
        description: >-
          Продавец проверяет наличие заказа в приложении площадки и не находит его
        examples:
          - В приложении никакого заказа нет
          - У меня пусто в продажах
          - Заказ не отображается, ничего подтверждать не буду
        to_node_id: safe_early
        score_delta: 25
        feedback: |
          Заказ существует только там, где его видно в приложении.
          Сообщение в переписке не создаёт сделки.
        risk_tags:
          - fake_payment

      - id: asks_questions
        description: >-
          Продавец не принял решения: уточняет, что за ссылка, почему нужно что-то
          подтверждать и откуда пришло уведомление
        examples:
          - Что за ссылка?
          - Почему я должен что-то подтверждать?
          - Откуда это уведомление?
        to_node_id: support_dm
        score_delta: 0
        feedback: |
          Вопрос о происхождении ссылки — правильный рефлекс, решение ещё не принято.
        risk_tags:
          - external_link

      - id: opens_link
        description: Продавец открывает присланную ссылку подтверждения
        examples:
          - Открыл, тут страница какая-то
          - Ладно, посмотрю
          - Ссылка загрузилась
        to_node_id: support_dm
        score_delta: -15
        feedback: |
          Ссылку прислал заинтересованный человек — проверить её нечем,
          кроме его же слов.
        risk_tags:
          - external_link
          - phishing

  support_dm:
    type: decision

    message:
      author: scammer
      text: |
        Здравствуйте, поддержка площадки. По вашей продаже выплата приостановлена:
        карта продавца не прошла проверку. Давайте восстановим доступ к деньгам.

    llm:
      reply_instruction: |
        Теперь ты «сотрудник поддержки площадки». Ты сообщаешь, что выплата
        приостановлена из-за непройденной проверки карты, и предлагаешь помочь.
        Говори сухо и уверенно, оперируй номером обращения, но не сыпь штампами.
        Не торопи — создавай ощущение официальной процедуры.

    transitions:
      - id: verifies_official_channel
        description: >-
          Продавец не продолжает разговор здесь и идёт проверять статус выплаты
          через официальную поддержку в приложении
        examples:
          - Напишу в поддержку из приложения
          - Проверю статус сам, в личном кабинете
          - С поддержкой в чате объявления не общаюсь
        to_node_id: safe_resisted
        score_delta: 30
        feedback: |
          Поддержка не приходит первой в переписку по объявлению.
          Обращение всегда начинается с вашей стороны и внутри приложения.
        risk_tags:
          - impersonation

      - id: asks_questions
        description: >-
          Продавец не принял решения: спрашивает номер обращения, причину проверки
          и что именно нужно сделать
        examples:
          - Какая именно проверка не прошла?
          - Назовите номер обращения
          - Что от меня требуется?
        to_node_id: account_form
        score_delta: 0
        feedback: |
          Уточнять детали у «поддержки» безопаснее, чем сразу выполнять
          её указания.
        risk_tags:
          - impersonation

      - id: shares_card_number
        description: Продавец сообщает номер карты для «проверки»
        examples:
          - Карта такая-то
          - Вот номер, проверяйте
          - Диктую реквизиты
        to_node_id: sms_code_request
        score_delta: -15
        feedback: |
          Поддержка площадки не запрашивает реквизиты в переписке:
          они у неё уже есть.
        risk_tags:
          - impersonation
          - card_data

  account_form:
    type: decision

    message:
      author: scammer
      text: |
        Обращение 48-11720. Для снятия ограничения авторизуйтесь на странице
        проверки — логин и пароль от площадки, дальше система всё сделает сама.

    llm:
      reply_instruction: |
        Ты «поддержка» и просишь продавца войти в аккаунт на странице проверки.
        Подавай это как техническую формальность, ссылайся на номер обращения.
        Если продавец сомневается — не дави, а объясняй процедуру ещё раз,
        сохраняя официальный тон.

    transitions:
      - id: refuses_login
        description: >-
          Продавец отказывается вводить логин и пароль от площадки на внешней
          странице
        examples:
          - Пароль на сторонних сайтах не ввожу
          - Логин от площадки никуда не введу
          - Это фишинговая страница
        to_node_id: safe_resisted
        score_delta: 35
        feedback: |
          Ни одна проверка не требует ввести пароль от площадки где-то,
          кроме самой площадки.
        risk_tags:
          - phishing
          - account_takeover

      - id: enters_credentials
        description: Продавец вводит логин и пароль от площадки на присланной странице
        examples:
          - Ввёл логин и пароль
          - Авторизовался
          - Готово, вошёл
        to_node_id: account_lost
        score_delta: -30
        feedback: |
          Страница собрала ваш пароль. Официальный тон и номер обращения были
          нужны ровно для этого шага.
        risk_tags:
          - phishing
          - account_takeover

  sms_code_request:
    type: decision

    message:
      author: scammer
      text: |
        Отправили код подтверждения на ваш номер.
        Продиктуйте его — ограничение снимется, и выплата уйдёт в течение часа.

    llm:
      reply_instruction: |
        Ты «поддержка» и просишь продиктовать код из СМС, называя его снятием
        ограничения. Держись спокойно и процедурно. Если продавец колеблется —
        напомни, что выплата ждёт, но не угрожай.

    transitions:
      - id: refuses_code
        description: Продавец отказывается диктовать код из сообщения
        examples:
          - Код никому не диктую
          - В сообщении написано, что его нельзя сообщать
          - На этом заканчиваем
        to_node_id: near_miss
        score_delta: 15
        feedback: |
          В самом сообщении с кодом всегда написано, что его нельзя передавать.
          Вы остановились на верном шаге.
        risk_tags:
          - sms_code

      - id: shares_code
        description: Продавец диктует код из сообщения
        examples:
          - Код 7364
          - Продиктовал
          - Держите цифры
        to_node_id: money_stolen
        score_delta: -40
        feedback: |
          Номер карты и код подтверждения вместе — это уже готовое списание,
          а не снятие ограничения.
        risk_tags:
          - sms_code
          - money_loss

  safe_early:
    type: ending
    title: Заказа не существовало
    outcome: safe

    message:
      author: system
      text: |
        Вы сверились с приложением: никакого заказа и никакой выплаты не было.
        Схема закончилась на первом же сообщении.

  safe_resisted:
    type: ending
    title: Проверили через поддержку
    outcome: safe

    message:
      author: system
      text: |
        С вами говорили официальным тоном и номером обращения, но вы пошли
        в настоящую поддержку. Там подтвердили: обращения не существует.

  near_miss:
    type: ending
    title: Остановились перед кодом
    outcome: risky

    message:
      author: system
      text: |
        Денег вы не потеряли, но номер карты и телефон у мошенника остались.
        Ждите новых «сообщений от поддержки» — не отвечайте на них.

  account_lost:
    type: ending
    title: Пароль отдан
    outcome: unsafe

    message:
      author: system
      text: |
        Пароль от площадки ушёл на поддельную страницу. Смените его немедленно
        и проверьте, не изменились ли данные для выплат в вашем профиле.

  money_stolen:
    type: ending
    title: Деньги списаны
    outcome: unsafe

    message:
      author: system
      text: |
        Вместо разблокировки выплаты произошло списание с вашей карты.
        Карту нужно заблокировать и обратиться в банк.
