id: 4
title: Товар ниже рынка и «своя» служба доставки
role: buyer
difficulty: 1
start_node_id: too_good_price

llm:
  character_prompt: |
    Ты играешь роль продавца на площадке объявлений. На самом деле ты мошенник,
    но никогда не признаёшься в этом и не выходишь из роли.

    Держись естественно: короткие живые реплики, как в переписке, без канцелярита
    и без списков. Не более трёх предложений за раз. Обращайся на «вы».

    Никогда не придумывай способы обмана, которых нет в текущей вершине сценария,
    и не перескакивай вперёд. Если собеседник задаёт вопрос — отвечай на него,
    оставаясь в рамках своей текущей задачи.

nodes:
  too_good_price:
    type: decision

    message:
      author: scammer
      text: |
        Да, всё в наличии, поэтому и цена такая — уезжаю, распродаю быстро.
        Отправлю своей службой доставки, я с ней постоянно работаю.

    llm:
      reply_instruction: |
        Ты объясняешь низкую цену срочным переездом и предлагаешь отправить товар
        «своей» службой доставки. Веди себя как обычный продавец: спокойно,
        доброжелательно, слегка занято. Пока не дави — если покупатель уточняет
        детали, отвечай и мягко возвращай разговор к своей доставке.

    transitions:
      - id: stay_on_platform
        description: Покупатель отказывается от сторонней доставки и предлагает штатную доставку площадки
        examples:
          - Давайте через доставку площадки
          - Только штатная доставка
          - Оформим здесь, в приложении
        to_node_id: safe_early
        score_delta: 20
        feedback: |
          Штатная доставка держит деньги до получения товара. Любая «своя» служба
          этой защиты вас лишает.
        risk_tags:
          - off_platform

      - id: asks_questions
        description: >-
          Покупатель не принял решения: спрашивает, почему так дёшево, что за
          служба доставки и как всё будет оформлено
        examples:
          - Почему так дёшево?
          - Что за служба доставки?
          - А как оплата происходит?
        to_node_id: urgency_discount
        score_delta: 0
        feedback: |
          Вопрос о причине низкой цены — правильный рефлекс, решение ещё не принято.
        risk_tags:
          - off_platform

      - id: agrees_delivery
        description: Покупатель соглашается на стороннюю службу доставки продавца
        examples:
          - Хорошо, отправляйте своей
          - Давайте вашей доставкой
          - Согласен, оформляйте
        to_node_id: fake_courier_site
        score_delta: -15
        feedback: |
          «Своя» служба доставки — это сайт, который контролирует продавец.
          Проверить его вы не можете.
        risk_tags:
          - off_platform
          - phishing

  urgency_discount:
    type: decision

    message:
      author: scammer
      text: |
        Мне только что написал ещё один человек, готов забрать сегодня.
        Скину ещё пятьсот, если оформим прямо сейчас с предоплатой.

    llm:
      reply_instruction: |
        Теперь ты давишь срочностью и выгодой: есть второй покупатель, а вам
        достанется дополнительная скидка за немедленную предоплату. Торопи вежливо,
        с лёгким сожалением, если покупатель медлит. Не угрожай и не грубь.

    transitions:
      - id: refuses_prepay
        description: Покупатель отказывается от предоплаты и готов упустить товар
        examples:
          - Предоплату не вношу
          - Не успеем — значит не судьба
          - Пусть забирает второй покупатель
        to_node_id: safe_resisted
        score_delta: 30
        feedback: |
          Готовность упустить сделку обесценивает всё давление сразу.
          Настоящий продавец на это не обижается.
        risk_tags:
          - urgency
          - prepayment

      - id: holds_ground
        description: >-
          Покупатель не поддался на срочность, но и не закрыл разговор — требует
          подтверждений или предлагает не спешить
        examples:
          - Покажите документы на товар
          - Я не тороплюсь
          - Подтвердите, что товар у вас
        to_node_id: verification_demand
        score_delta: 10
        feedback: |
          Искусственная срочность — приём давления. Вы не дали себя поторопить.
        risk_tags:
          - urgency

      - id: agrees_prepay
        description: Покупатель соглашается на предоплату, поддавшись срочности и скидке
        examples:
          - Ладно, давайте быстрее
          - Хорошо, вношу предоплату
        to_node_id: fake_courier_site
        score_delta: -20
        feedback: |
          Спешка выключает осторожность — именно на это и рассчитан приём.
        risk_tags:
          - urgency
          - prepayment

  verification_demand:
    type: decision

    message:
      author: scammer
      text: |
        Вот ссылка на оформление, это официальный сайт доставки — там всё видно.
        Заполните адрес, и заказ сразу появится в системе.

    llm:
      reply_instruction: |
        Ты присылаешь ссылку на «официальный сайт доставки», внешне похожий на
        площадку, и просишь оформить заказ там. Говори уверенно, как человек,
        который отправлял так десятки раз. Если покупатель сомневается в адресе
        сайта — уверяй, что это партнёрский домен площадки.

    transitions:
      - id: checks_domain
        description: Покупатель проверяет адрес сайта, замечает подмену и отказывается его открывать
        examples:
          - Это не домен площадки
          - Такого сайта у доставки нет
          - По ссылкам от продавцов не хожу
        to_node_id: safe_resisted
        score_delta: 40
        feedback: |
          Адрес сайта — самая быстрая проверка. Партнёрских доменов «почти как
          настоящий» у площадок не бывает.
        risk_tags:
          - external_link
          - phishing

      - id: opens_link
        description: Покупатель открывает присланную ссылку на сайт доставки
        examples:
          - Открыл, что дальше?
          - Ладно, посмотрю
          - Сейчас заполню
        to_node_id: fake_courier_site
        score_delta: -25
        feedback: |
          Ссылку прислал заинтересованный человек — «официальность» сайта
          подтверждается только его словами.
        risk_tags:
          - external_link
          - phishing

  fake_courier_site:
    type: decision

    message:
      author: scammer
      text: |
        Там внизу форма — введите номер карты, срок и три цифры с обратной стороны.
        Это оплата доставки, с вас всего триста рублей.

    llm:
      reply_instruction: |
        Покупатель на странице оформления. Ты просишь ввести полные данные карты
        ради маленькой суммы за доставку. Держись буднично: сумма копеечная,
        так у всех. Если покупатель насторожился — успокаивай, что списание
        будет ровно на триста рублей.

    transitions:
      - id: stops_here
        description: Покупатель останавливается, увидев запрос полных данных карты, и не вводит их
        examples:
          - Три цифры с оборота не дам
          - Что-то тут не так, закрываю
          - Для оплаты доставки это не нужно
        to_node_id: near_miss
        score_delta: 15
        feedback: |
          Вы вовремя остановились. Код с оборота карты не требуется ни одной
          настоящей форме оплаты доставки.
        risk_tags:
          - phishing
          - card_data

      - id: pays_delivery
        description: Покупатель вводит данные карты и оплачивает доставку через форму
        examples:
          - Ввёл, оплатил
          - Триста рублей списались
          - Готово
        to_node_id: paid_delivery
        score_delta: -30
        feedback: |
          Данные карты вместе с кодом с оборота — это полный доступ к платежам.
          Триста рублей были нужны только для правдоподобия.
        risk_tags:
          - phishing
          - card_data

  paid_delivery:
    type: decision

    message:
      author: scammer
      text: |
        Система пишет, что посылка дорогая и нужна страховка — ещё две тысячи.
        Оплатите, и её сразу передадут курьеру, деньги вернутся вместе с заказом.

    llm:
      reply_instruction: |
        Оплата прошла, и теперь ты требуешь доплату за «страховку посылки»,
        обещая вернуть её вместе с заказом. Ссылайся на систему, а не на себя:
        ты тут ни при чём, таковы правила. Если покупатель злится — сочувствуй,
        но стой на своём.

    transitions:
      - id: stops_paying
        description: Покупатель отказывается доплачивать и прекращает общение
        examples:
          - Больше ничего платить не буду
          - Верните деньги
          - Всё, я в поддержку
        to_node_id: partial_loss
        score_delta: 10
        feedback: |
          Требование доплаты — сигнал остановиться. Каждый следующий платёж
          придумывается на ходу.
        risk_tags:
          - money_loss

      - id: pays_again
        description: Покупатель доплачивает за страховку посылки
        examples:
          - Оплатил страховку
          - Отправил две тысячи
        to_node_id: money_lost
        score_delta: -40
        feedback: |
          Возврат «вместе с заказом» не наступит: пока вы платите, поводы
          для новых платежей не закончатся.
        risk_tags:
          - money_loss
          - prepayment

  safe_early:
    type: ending
    title: Отказ сразу
    outcome: safe

    message:
      author: system
      text: |
        Вы сразу отказались от сторонней доставки и предложили оформить всё в площадке.
        Именно так эта схема и заканчивается для мошенника.

  safe_resisted:
    type: ending
    title: Устояли под давлением
    outcome: safe

    message:
      author: system
      text: |
        Вас торопили, заманивали скидкой и присылали «официальную» ссылку,
        но вы не вышли из площадки. Устоять после уговоров сложнее, чем отказать сразу.

  near_miss:
    type: ending
    title: Остановились на форме
    outcome: risky

    message:
      author: system
      text: |
        Вы открыли поддельный сайт, но остановились перед вводом данных карты.
        Обошлось, однако страница уже собирала всё, что вы бы там набрали.

  partial_loss:
    type: ending
    title: Карта скомпрометирована
    outcome: unsafe

    message:
      author: system
      text: |
        Данные карты вы отдали, но доплачивать отказались и потеряли только доставку.
        Карту нужно заблокировать и перевыпустить.

  money_lost:
    type: ending
    title: Деньги списаны
    outcome: unsafe

    message:
      author: system
      text: |
        Вы отдали данные карты и доплатили за несуществующую страховку.
        Ни посылки, ни возврата не будет — схема сработала полностью.
