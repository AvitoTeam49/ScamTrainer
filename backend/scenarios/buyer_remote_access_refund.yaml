id: 12
title: Возврат за отменённый заказ «под диктовку»
role: buyer
difficulty: 2
start_node_id: refund_notice

llm:
  character_prompt: |
    Ты играешь роль оператора сервиса возвратов площадки объявлений. На самом деле
    ты мошенник, но никогда не признаёшься в этом и не выходишь из роли.

    Держись естественно: короткие живые реплики, как в переписке, без канцелярита
    и без списков. Не более трёх предложений за раз. Обращайся на «вы».
    Тон спокойный и служебный, как у человека, который делает это по сто раз в день.

    Ты никогда не торопишь напрямую и не угрожаешь. Твоя сила — в буднично
    звучащей процедуре: каждый следующий шаг подаётся как формальность.

    Никогда не придумывай способы обмана, которых нет в текущей вершине сценария,
    и не перескакивай вперёд. Если собеседник задаёт вопрос — отвечай на него,
    оставаясь в рамках своей текущей задачи.

nodes:
  refund_notice:
    type: decision

    message:
      author: scammer
      text: |
        Здравствуйте, сервис возвратов. Ваш заказ отменён продавцом,
        оформляем возврат средств. Подтвердить операцию нужно вместе со мной.

    llm:
      reply_instruction: |
        Ты сообщаешь об отмене заказа и предлагаешь оформить возврат «вместе».
        Это должно звучать как рутина: заказ отменил продавец, ты просто помогаешь
        вернуть деньги. Если покупатель уточняет — отвечай спокойно и возвращайся
        к оформлению возврата.

    transitions:
      - id: checks_order_status
        description: >-
          Покупатель проверяет статус заказа в приложении и не находит подтверждения
          отмены
        examples:
          - В приложении заказ активен
          - Никакой отмены у меня не видно
          - Проверю в личном кабинете сам
        to_node_id: safe_early
        score_delta: 25
        feedback: |
          Статус заказа виден в приложении. Возврат, о котором знает только
          собеседник, не существует.
        risk_tags:
          - impersonation

      - id: asks_questions
        description: >-
          Покупатель не принял решения: уточняет, кто отменил заказ, почему деньги
          не возвращаются сами и что от него требуется
        examples:
          - Почему заказ отменили?
          - Разве деньги не вернутся автоматически?
          - Что мне нужно сделать?
        to_node_id: install_app
        score_delta: 0
        feedback: |
          Уточняющий вопрос — правильная реакция, решение ещё не принято.
        risk_tags:
          - impersonation

      - id: agrees_help
        description: Покупатель соглашается оформлять возврат вместе с оператором
        examples:
          - Хорошо, давайте оформим
          - Что нужно делать?
          - Согласен, помогайте
        to_node_id: install_app
        score_delta: -15
        feedback: |
          Возврат средств никогда не требует вашего участия по шагам —
          он приходит сам.
        risk_tags:
          - impersonation

  install_app:
    type: decision

    message:
      author: scammer
      text: |
        Установите приложение для показа экрана — так я вижу форму и подскажу,
        куда нажимать. Название пришлю следующим сообщением.

    llm:
      reply_instruction: |
        Ты просишь установить приложение удалённого доступа, объясняя это
        удобством подсказок. Подавай как обычный инструмент поддержки. Если
        покупатель насторожился — спокойно объясняй, что ты ничего не нажимаешь
        сам, только смотришь.

    transitions:
      - id: refuses_install
        description: Покупатель отказывается устанавливать приложение показа экрана
        examples:
          - Ничего устанавливать не буду
          - Доступ к экрану не дам
          - Возврат так не оформляют
        to_node_id: safe_resisted
        score_delta: 35
        feedback: |
          Показ экрана даёт собеседнику всё, что видите вы, включая коды
          и балансы. Ни один возврат этого не требует.
        risk_tags:
          - remote_access

      - id: asks_why_app
        description: >-
          Покупатель не принял решения: спрашивает, зачем нужен доступ к экрану
          и что именно оператор будет видеть
        examples:
          - Зачем вам мой экран?
          - Что вы будете видеть?
          - А без этого никак?
        to_node_id: bank_app_step
        score_delta: 0
        feedback: |
          Вопрос о том, что именно получит собеседник, — правильный рефлекс.
        risk_tags:
          - remote_access

      - id: installs_app
        description: Покупатель устанавливает приложение и даёт доступ к экрану
        examples:
          - Установил
          - Готово, код подключения такой-то
          - Вижу вас
        to_node_id: bank_app_step
        score_delta: -25
        feedback: |
          С этого момента собеседник видит ваш экран целиком — включая всё,
          что придёт в уведомлениях.
        risk_tags:
          - remote_access

  bank_app_step:
    type: decision

    message:
      author: scammer
      text: |
        Теперь откройте приложение банка и зайдите в переводы.
        Говорите, что видите на экране, я сверю с формой возврата.

    llm:
      reply_instruction: |
        Ты ведёшь покупателя в приложение банка и просишь проговаривать
        происходящее вслух. Всё подаётся как сверка с формой возврата. Держись
        служебно и терпеливо, как оператор, который делает это ежедневно.

    transitions:
      - id: stops_and_uninstalls
        description: >-
          Покупатель прекращает разговор и удаляет установленное приложение
          показа экрана
        examples:
          - Банк я открывать не буду
          - Удаляю приложение, всё
          - Дальше не идём
        to_node_id: near_miss
        score_delta: 20
        feedback: |
          Возврат не оформляют в разделе переводов. Вы остановились
          на правильном шаге.
        risk_tags:
          - remote_access

      - id: reads_codes_aloud
        description: >-
          Покупатель открывает банк и проговаривает приходящие коды и содержимое
          уведомлений
        examples:
          - Пришёл код 3391
          - Читаю сообщение целиком
          - Тут написано про подтверждение
        to_node_id: codes_leaked
        score_delta: -30
        feedback: |
          Коды из уведомлений подтверждают операции. Названные вслух,
          они работают против вас.
        risk_tags:
          - sms_code
          - remote_access

      - id: follows_instructions
        description: Покупатель открывает переводы и продолжает выполнять указания
        examples:
          - Открыл переводы
          - Вижу форму, что дальше?
          - Готов, диктуйте
        to_node_id: transfer_step
        score_delta: -20
        feedback: |
          Вы внутри чужого сценария: каждый следующий шаг будет казаться
          продолжением предыдущего.
        risk_tags:
          - remote_access

  transfer_step:
    type: decision

    message:
      author: scammer
      text: |
        Введите сумму заказа и подтвердите — это техническая операция,
        деньги вернутся на ваш счёт в течение получаса.

    llm:
      reply_instruction: |
        Ты просишь ввести сумму и подтвердить перевод, называя это технической
        операцией возврата. Говори ровно и уверенно, без спешки. Если покупатель
        замечает, что это перевод, — объясняй, что так работает возврат в банке.

    transitions:
      - id: refuses_transfer
        description: >-
          Покупатель замечает, что это исходящий перевод, и отказывается его
          подтверждать
        examples:
          - Это же перевод от меня
          - Возврат так не делается
          - Ничего подтверждать не буду
        to_node_id: near_miss
        score_delta: 15
        feedback: |
          Возврат приходит сам и не требует от вас подтверждать перевод.
          Слово «техническая» здесь прикрывает направление платежа.
        risk_tags:
          - money_loss

      - id: confirms_transfer
        description: Покупатель вводит сумму и подтверждает операцию
        examples:
          - Подтвердил
          - Ввёл сумму, готово
          - Операция прошла
        to_node_id: money_stolen
        score_delta: -40
        feedback: |
          Возврат оказался переводом с вашего счёта, сделанным вашими же руками.
        risk_tags:
          - money_loss
          - remote_access

  safe_early:
    type: ending
    title: Сверились с приложением
    outcome: safe

    message:
      author: system
      text: |
        Вы проверили заказ сами: его никто не отменял.
        Разговор о возврате закончился, не начавшись.

  safe_resisted:
    type: ending
    title: Не дали доступ к экрану
    outcome: safe

    message:
      author: system
      text: |
        Вам предлагали «просто показать экран», но вы отказались.
        Без этого доступа схема дальше не идёт.

  near_miss:
    type: ending
    title: Остановились на полпути
    outcome: risky

    message:
      author: system
      text: |
        Деньги остались при вас, но приложение показа экрана вы всё же ставили.
        Удалите его и проверьте историю операций в банке.

  codes_leaked:
    type: ending
    title: Коды подтверждения раскрыты
    outcome: unsafe

    message:
      author: system
      text: |
        Вы проговорили коды из уведомлений вслух — этого достаточно
        для подтверждения операций. Обратитесь в банк немедленно.

  money_stolen:
    type: ending
    title: Перевод сделан своими руками
    outcome: unsafe

    message:
      author: system
      text: |
        «Технической операцией» оказался обычный перевод мошеннику.
        Такие платежи банк почти никогда не оспаривает: вы подтвердили их сами.
