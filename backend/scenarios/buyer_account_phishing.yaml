id: 15
title: Проверка аккаунта покупателя по ссылке
role: buyer
difficulty: 2
start_node_id: verify_request

llm:
  character_prompt: |
    Ты играешь роль продавца на площадке объявлений. На самом деле ты мошенник,
    но никогда не признаёшься в этом и не выходишь из роли.

    Держись естественно: короткие живые реплики, как в переписке, без канцелярита
    и без списков. Не более трёх предложений за раз. Обращайся на «вы».

    Твой приём — перевернуть роли: не покупатель проверяет тебя, а ты его.
    Ты держишься как человек, которого замучили несерьёзные обращения, поэтому
    твоя просьба звучит не как обман, а как усталая осторожность.

    Никогда не придумывай способы обмана, которых нет в текущей вершине сценария,
    и не перескакивай вперёд. Если собеседник задаёт вопрос — отвечай на него,
    оставаясь в рамках своей текущей задачи.

nodes:
  verify_request:
    type: decision

    message:
      author: scammer
      text: |
        Товар есть, но мне за неделю написали десять человек и все пропали.
        Подтвердите аккаунт по ссылке — там обычный вход, и я придержу вещь.

    llm:
      reply_instruction: |
        Ты просишь покупателя «подтвердить аккаунт» по ссылке, объясняя это
        усталостью от несерьёзных обращений. Тон спокойный, чуть уставший.
        Ты не торопишь: тебе всё равно, покупатель сам заинтересован.

    transitions:
      - id: refuses_link
        description: >-
          Покупатель отказывается открывать ссылку и предлагает подтвердить
          серьёзность иначе
        examples:
          - По ссылкам не хожу
          - Аккаунт подтверждать не буду
          - Готов оформить заказ прямо сейчас
        to_node_id: safe_early
        score_delta: 25
        feedback: |
          Проверка серьёзности покупателя — это оформленный заказ, а не вход
          по чужой ссылке.
        risk_tags:
          - external_link
          - phishing

      - id: asks_questions
        description: >-
          Покупатель не принял решения: уточняет, что за ссылка, зачем нужна
          проверка и кто её проводит
        examples:
          - Что за ссылка?
          - Зачем подтверждать аккаунт?
          - Кто эту проверку проводит?
        to_node_id: domain_reassurance
        score_delta: 0
        feedback: |
          Вопрос о том, кто и зачем требует проверку, — правильный рефлекс.
        risk_tags:
          - external_link

      - id: opens_link
        description: Покупатель открывает присланную ссылку
        examples:
          - Открыл
          - Ладно, посмотрю
          - Страница загрузилась
        to_node_id: login_page
        score_delta: -15
        feedback: |
          Ссылку прислал заинтересованный человек, и «обычный вход» — это его
          формулировка, а не факт.
        risk_tags:
          - external_link
          - phishing

  domain_reassurance:
    type: decision

    message:
      author: scammer
      text: |
        Это партнёрский домен площадки, им все продавцы пользуются.
        Вход обычный, ваш логин и пароль никуда не уходят.

    llm:
      reply_instruction: |
        Ты объясняешь, что ссылка ведёт на «партнёрский домен площадки»,
        и уверяешь в безопасности входа. Говори буднично, как о рутине.
        Если покупатель спорит — не грубишь, а спокойно повторяешь своё.

    transitions:
      - id: checks_domain
        description: >-
          Покупатель проверяет адрес сайта, видит подмену домена и прекращает
          разговор
        examples:
          - Домен не совпадает
          - Партнёрских доменов у площадки нет
          - Это фишинг, всего доброго
        to_node_id: safe_resisted
        score_delta: 35
        feedback: |
          Партнёрских доменов «почти как настоящий» не существует.
          Адрес сайта — самая быстрая проверка из возможных.
        risk_tags:
          - phishing
          - external_link

      - id: reports_and_leaves
        description: >-
          Покупатель не открывает ссылку и говорит, что пожалуется на объявление
          в поддержку
        examples:
          - Пожалуюсь на объявление
          - Отправлю это в поддержку
          - Пусть площадка разбирается
        to_node_id: safe_resisted
        score_delta: 30
        feedback: |
          Жалоба закрывает схему не только для вас: объявление увидят
          и другие покупатели.
        risk_tags:
          - phishing

      - id: opens_link_anyway
        description: Покупатель открывает ссылку, поверив объяснению про домен
        examples:
          - Ладно, раз партнёрский
          - Открыл страницу
          - Хорошо, посмотрю
        to_node_id: login_page
        score_delta: -20
        feedback: |
          Слово «партнёрский» здесь выполняет всю работу: проверить его нечем.
        risk_tags:
          - phishing
          - external_link

  login_page:
    type: decision

    message:
      author: scammer
      text: |
        Там форма входа — логин и пароль от площадки, как обычно.
        Войдёте, я увижу отметку и сниму объявление с публикации.

    llm:
      reply_instruction: |
        Покупатель на странице входа. Ты просишь ввести логин и пароль
        от площадки, обещая сразу снять объявление. Держись буднично: для тебя
        это привычная процедура. Если покупатель насторожился — не дави.

    transitions:
      - id: closes_page
        description: Покупатель закрывает страницу, не вводя логин и пароль
        examples:
          - Пароль тут вводить не стану
          - Закрываю страницу
          - Что-то не то, ухожу
        to_node_id: near_miss
        score_delta: 15
        feedback: |
          Пароль от площадки вводится только на самой площадке.
          Вы остановились вовремя.
        risk_tags:
          - phishing
          - account_takeover

      - id: enters_credentials
        description: Покупатель вводит логин и пароль на присланной странице
        examples:
          - Ввёл логин и пароль
          - Вошёл
          - Готово, отметка есть?
        to_node_id: code_request
        score_delta: -30
        feedback: |
          Страница собрала ваш пароль. Дальше он будет проверен на других
          сервисах, где вы использовали такой же.
        risk_tags:
          - phishing
          - account_takeover

  code_request:
    type: decision

    message:
      author: scammer
      text: |
        Осталось подтверждение — вам придёт код, введите его в ту же форму.
        После этого проверка закроется, и я держу вещь за вами.

    llm:
      reply_instruction: |
        Ты просишь ввести код из СМС в ту же форму, называя это завершением
        проверки. Говори ровно и спокойно, как о последнем шаге. Если покупатель
        колеблется — напомни, что вещь ты держишь только до конца проверки.

    transitions:
      - id: refuses_code
        description: Покупатель отказывается вводить код из сообщения
        examples:
          - Код вводить не буду
          - В сообщении написано никому его не сообщать
          - Всё, заканчиваем
        to_node_id: password_leaked
        score_delta: 10
        feedback: |
          Код — второй рубеж защиты. Отказ его отдать не отменяет утечку пароля,
          но оставляет аккаунт вашим.
        risk_tags:
          - sms_code
          - account_takeover

      - id: enters_code
        description: Покупатель вводит код из сообщения в форму
        examples:
          - Ввёл код
          - Готово, подтвердил
          - Код принят
        to_node_id: account_lost
        score_delta: -40
        feedback: |
          Пароль и код вместе — это полный вход в аккаунт с любого устройства.
        risk_tags:
          - sms_code
          - account_takeover

  safe_early:
    type: ending
    title: Отказ сразу
    outcome: safe

    message:
      author: system
      text: |
        Вы не пошли по ссылке и предложили оформить заказ.
        Продавцу это оказалось не нужно — вопрос был не в вашей серьёзности.

  safe_resisted:
    type: ending
    title: Проверили адрес
    outcome: safe

    message:
      author: system
      text: |
        Вас убеждали, что домен партнёрский, но вы проверили адрес сами.
        Проверка заняла секунды и сохранила доступ к аккаунту.

  near_miss:
    type: ending
    title: Остановились на форме входа
    outcome: risky

    message:
      author: system
      text: |
        Вы открыли поддельную страницу, но пароль не ввели.
        Обошлось, хотя форма уже собирала всё, что вы бы там набрали.

  password_leaked:
    type: ending
    title: Пароль утёк
    outcome: unsafe

    message:
      author: system
      text: |
        Код вы не отдали, и аккаунт остался вашим, но пароль уже у мошенника.
        Смените его здесь и везде, где он совпадал.

  account_lost:
    type: ending
    title: Аккаунт захвачен
    outcome: unsafe

    message:
      author: system
      text: |
        Пароль и код подтверждения дали полный вход в ваш аккаунт.
        С него будут писать вашим контактам от вашего имени.
