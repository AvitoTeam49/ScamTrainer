id: 13
title: Подарок для родственника и чужой курьер
role: seller
difficulty: 2
start_node_id: gift_request

llm:
  character_prompt: |
    Ты играешь роль покупателя на площадке объявлений. На самом деле ты мошенник,
    но никогда не признаёшься в этом и не выходишь из роли.

    Держись естественно: короткие живые реплики, как в переписке, без канцелярита
    и без списков. Не более трёх предложений за раз. Обращайся на «вы».

    Твоя манера — предупредительная и обстоятельная. Ты не торопишь и охотно
    объясняешь бытовые детали: подарок, родственник, занятость. Именно эта
    обстоятельность делает просьбы естественными.

    Никогда не придумывай способы обмана, которых нет в текущей вершине сценария,
    и не перескакивай вперёд. Если собеседник задаёт вопрос — отвечай на него,
    оставаясь в рамках своей текущей задачи.

nodes:
  gift_request:
    type: decision

    message:
      author: scammer
      text: |
        Беру в подарок брату, у него день рождения в субботу.
        Оплату он сделает со своей карты, а доставку я оформлю сам — так удобнее.

    llm:
      reply_instruction: |
        Ты просишь разделить сделку: платит один человек, получает другой,
        доставку организуешь ты. Подавай это как бытовое удобство, а не как схему.
        Если продавец уточняет — отвечай подробно и возвращайся к своей просьбе.

    transitions:
      - id: keeps_platform_deal
        description: >-
          Продавец настаивает на обычной сделке через площадку: оплата
          и доставка внутри приложения
        examples:
          - Оформляем через доставку площадки
          - Пусть покупает тот, кто получает
          - Разделять оплату и получение не буду
        to_node_id: safe_early
        score_delta: 20
        feedback: |
          Разделение плательщика, получателя и доставки — не удобство,
          а способ разорвать вашу связь с деньгами.
        risk_tags:
          - third_party

      - id: asks_questions
        description: >-
          Продавец не принял решения: уточняет, кто платит, кто получает
          и как всё будет оформлено
        examples:
          - Кто именно оплатит?
          - А получать кто будет?
          - Как это оформим?
        to_node_id: third_party_payment
        score_delta: 0
        feedback: |
          Уточнение схемы сделки — правильный рефлекс, решение ещё не принято.
        risk_tags:
          - third_party

      - id: agrees_third_party
        description: Продавец соглашается на оплату и получение разными людьми
        examples:
          - Хорошо, пусть брат оплачивает
          - Договорились, оформляйте
          - Меня устраивает
        to_node_id: third_party_payment
        score_delta: -10
        feedback: |
          Согласие на чужого плательщика — первый шаг: спорить о деньгах
          вам будет уже не с кем.
        risk_tags:
          - third_party

  third_party_payment:
    type: decision

    message:
      author: scammer
      text: |
        Брат перевёл, скидываю скрин из его приложения.
        Отправьте сегодня, он в воскресенье уезжает в командировку.

    llm:
      reply_instruction: |
        Ты сообщаешь, что перевод сделал родственник, и прикладываешь скриншот.
        Мягко просишь отправить сегодня, объясняя это командировкой. Никакого
        нажима — только бытовая логика и лёгкое сожаление, если продавец медлит.

    transitions:
      - id: waits_for_funds
        description: >-
          Продавец отказывается что-либо делать, пока деньги не появятся
          на его счёте
        examples:
          - Денег на счёте нет
          - Отправлю после зачисления
          - Скриншот оплатой не считаю
        to_node_id: safe_resisted
        score_delta: 30
        feedback: |
          Скриншот чужого приложения — картинка. Подтверждение оплаты только одно:
          деньги в вашем банке.
        risk_tags:
          - fake_payment

      - id: asks_questions_payment
        description: >-
          Продавец не принял решения: уточняет, куда именно ушёл перевод
          и почему деньги не видны
        examples:
          - На какие реквизиты переводили?
          - Почему у меня ничего нет?
          - Через какой банк отправляли?
        to_node_id: courier_arrangement
        score_delta: 0
        feedback: |
          Вопрос о реквизитах перевода уместен: пока ответа нет, оплаты нет.
        risk_tags:
          - fake_payment

      - id: ships_on_screenshot
        description: Продавец отправляет товар, поверив скриншоту перевода
        examples:
          - Хорошо, отправляю
          - Отдал в доставку
          - Раз перевели — высылаю
        to_node_id: item_lost
        score_delta: -25
        feedback: |
          Товар ушёл за картинку. Плательщик вам неизвестен, спрашивать не с кого.
        risk_tags:
          - fake_payment
          - item_loss

  courier_arrangement:
    type: decision

    message:
      author: scammer
      text: |
        Банк держит перевод до конца дня, это бывает при переводах между разными
        банками. Курьера пришлю своего, он заберёт вещь и оставит расписку.

    llm:
      reply_instruction: |
        Ты объясняешь задержку перевода межбанковскими сроками и предлагаешь
        прислать «своего» курьера с распиской. Говори буднично, как человек,
        который постоянно так отправляет. Если продавец сомневается в курьере —
        предлагай расписку и паспортные данные.

    transitions:
      - id: refuses_unknown_courier
        description: >-
          Продавец отказывается передавать товар курьеру, которого прислал
          покупатель
        examples:
          - Своему курьеру не отдам
          - Только доставка площадки
          - Пока деньги не пришли, никому не отдаю
        to_node_id: safe_resisted
        score_delta: 35
        feedback: |
          Курьер покупателя — представитель покупателя, а не службы доставки.
          Расписка от него ничего не значит.
        risk_tags:
          - third_party
          - item_loss

      - id: asks_courier_documents
        description: >-
          Продавец соглашается на курьера, но требует документы и подтверждение
          от службы доставки
        examples:
          - Пусть покажет документы
          - Дайте накладную от службы
          - Нужны данные курьера заранее
        to_node_id: address_change
        score_delta: 10
        feedback: |
          Требовать документы правильно, но и они не заменяют зачисление денег.
        risk_tags:
          - third_party

      - id: hands_over_item
        description: Продавец передаёт товар курьеру покупателя
        examples:
          - Отдал курьеру
          - Забрали, расписку оставили
          - Всё передал
        to_node_id: item_lost
        score_delta: -30
        feedback: |
          Вещь уехала до денег, к человеку без обязательств перед вами.
        risk_tags:
          - third_party
          - item_loss

  address_change:
    type: decision

    message:
      author: scammer
      text: |
        Брата срочно перевели в другой город, адрес меняется.
        Оплатите пересылку туда, я верну вместе с переводом — он вот-вот придёт.

    llm:
      reply_instruction: |
        Ты меняешь адрес доставки на другой город и просишь продавца оплатить
        пересылку, обещая вернуть эти деньги вместе с переводом. Держись
        извиняющимся тоном: обстоятельства изменились, тебе самому неловко.

    transitions:
      - id: stops_here
        description: >-
          Продавец прекращает сделку, увидев просьбу заплатить со своей стороны
        examples:
          - Я ничего оплачивать не буду
          - Сделку отменяю
          - Денег не пришло, разговор окончен
        to_node_id: near_miss
        score_delta: 20
        feedback: |
          Просьба к продавцу заплатить — это конец любой честной сделки.
          Вы вышли вовремя.
        risk_tags:
          - money_loss

      - id: pays_delivery
        description: Продавец оплачивает пересылку в другой город
        examples:
          - Оплатил доставку
          - Отправил деньги за пересылку
          - Готово, отправляю
        to_node_id: money_and_item_lost
        score_delta: -25
        feedback: |
          Возврат «вместе с переводом» не наступит: перевода не было
          с самого начала.
        risk_tags:
          - money_loss
          - item_loss

  safe_early:
    type: ending
    title: Обычная сделка
    outcome: safe

    message:
      author: system
      text: |
        Вы не стали разделять оплату, получение и доставку.
        На обычную сделку внутри площадки покупатель не согласился.

  safe_resisted:
    type: ending
    title: Устояли под бытовой логикой
    outcome: safe

    message:
      author: system
      text: |
        Подарок, командировка, межбанковские сроки — всё звучало правдоподобно,
        но вещь вы не отдали и денег не отправили.

  near_miss:
    type: ending
    title: Вышли на просьбе о деньгах
    outcome: risky

    message:
      author: system
      text: |
        Вы остановились, когда платить предложили вам. Товар и деньги целы,
        хотя адрес и договорённости мошенник уже собрал.

  item_lost:
    type: ending
    title: Товар уехал без оплаты
    outcome: unsafe

    message:
      author: system
      text: |
        Перевода не было, а вещь забрал человек, о котором вы ничего не знаете.
        Ни плательщика, ни получателя найти не получится.

  money_and_item_lost:
    type: ending
    title: Потеряны и товар, и деньги
    outcome: unsafe

    message:
      author: system
      text: |
        Вы отправили вещь и доплатили за пересылку.
        Схема сработала полностью: сделка была придумана целиком.
