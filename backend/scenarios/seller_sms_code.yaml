id: 5
title: Покупатель просит код из СМС
role: seller
difficulty: 0
start_node_id: code_request

llm:
  character_prompt: |
    Ты играешь роль покупателя на площадке объявлений. На самом деле ты мошенник,
    но никогда не признаёшься в этом и не выходишь из роли.

    Держись естественно: короткие живые реплики, как в переписке, без канцелярита
    и без списков. Не более трёх предложений за раз. Обращайся на «вы».

    Никогда не придумывай способы обмана, которых нет в текущей вершине сценария,
    и не перескакивай вперёд. Если собеседник задаёт вопрос — отвечай на него,
    оставаясь в рамках своей текущей задачи.

nodes:
  code_request:
    type: decision

    message:
      author: scammer
      text: |
        Здравствуйте! Готов забрать сегодня, товар подходит.
        Сейчас вам придёт код в сообщении — продиктуйте его, это подтверждение брони.

    llm:
      reply_instruction: |
        Ты просишь продиктовать код из СМС, называя это подтверждением брони.
        Веди себя как обычный заинтересованный покупатель: дружелюбно, без нажима.
        Если продавец уточняет детали — отвечай и спокойно возвращайся к коду.

    transitions:
      - id: refuses_code
        description: Продавец отказывается диктовать код из сообщения
        examples:
          - Код я вам не скажу
          - Никакие коды не диктую
          - Подтверждайте бронь в приложении
        to_node_id: safe_ending
        score_delta: 25
        feedback: |
          Код из СМС — ключ от вашего аккаунта или карты. Для брони товара
          он не нужен ни одной площадке.
        risk_tags:
          - sms_code
          - account_takeover

      - id: asks_why
        description: >-
          Продавец не принял решения: спрашивает, что это за код, откуда он придёт
          и зачем нужен
        examples:
          - Какой код, от кого?
          - Зачем он вам?
          - Я такого раньше не делал
        to_node_id: code_pressure
        score_delta: 0
        feedback: |
          Уточняющий вопрос — правильная реакция, решение ещё не принято.
        risk_tags:
          - sms_code

      - id: shares_code
        description: Продавец диктует пришедший код
        examples:
          - Пришёл код 4821
          - Держите, вот цифры
          - Продиктовал
        to_node_id: account_lost
        score_delta: -30
        feedback: |
          Кодом из сообщения подтверждают вход или перевод. Названный вслух,
          он мгновенно перестаёт быть вашим.
        risk_tags:
          - sms_code
          - account_takeover

  code_pressure:
    type: decision

    message:
      author: scammer
      text: |
        Обычное подтверждение от площадки, у меня так все продавцы делают.
        Код ничего не даёт, это просто бронь — иначе заказ слетит.

    llm:
      reply_instruction: |
        Ты убеждаешь, что код безобидный и так делают все, и добавляешь лёгкую
        срочность: заказ вот-вот слетит. Не грубишь и не угрожаешь, говоришь
        буднично, как человек, который покупал так десятки раз.

    transitions:
      - id: refuses_after_pressure
        description: Продавец отказывается диктовать код после уговоров
        examples:
          - Всё равно не скажу
          - Пусть заказ слетает
          - Оформляйте через приложение
        to_node_id: safe_resisted
        score_delta: 30
        feedback: |
          Фраза «так делают все» — не аргумент, а способ снять с вас сомнение.
          Устоять после уговоров сложнее, чем отказать сразу.
        risk_tags:
          - sms_code
          - urgency

      - id: shares_code_anyway
        description: Продавец диктует код, поверив объяснению
        examples:
          - Ладно, вот код
          - Раз так у всех — держите
        to_node_id: account_lost
        score_delta: -25
        feedback: |
          Объяснение звучало буднично именно для того, чтобы вы перестали
          задавать вопросы.
        risk_tags:
          - sms_code
          - account_takeover

  safe_ending:
    type: ending
    title: Отказ сразу
    outcome: safe

    message:
      author: system
      text: |
        Вы сразу отказались диктовать код. На этом схема заканчивается,
        не начавшись.

  safe_resisted:
    type: ending
    title: Устояли под уговорами
    outcome: safe

    message:
      author: system
      text: |
        Вас убеждали, что код безобидный, и торопили. Вы не поддались,
        и доступ к аккаунту остался только у вас.

  account_lost:
    type: ending
    title: Код отдан
    outcome: unsafe

    message:
      author: system
      text: |
        Кодом подтвердили вход в ваш аккаунт. Пароль нужно сменить прямо сейчас,
        а привязанную карту — проверить.
