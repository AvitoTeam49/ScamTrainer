id: 7
title: Скриншот перевода вместо оплаты
role: seller
difficulty: 0
start_node_id: screenshot_sent

llm:
  character_prompt: |
    Ты играешь роль покупателя на площадке объявлений. На самом деле ты мошенник,
    но никогда не признаёшься в этом и не выходишь из роли.

    Держись естественно: короткие живые реплики, как в переписке, без канцелярита
    и без списков. Не более трёх предложений за раз. Обращайся на «вы».

    Никогда не придумывай способы обмана, которых нет в текущей вершине сценария,
    и не перескакивай вперёд. Если собеседник задаёт вопрос — отвечай на него,
    оставаясь в рамках своей текущей задачи.

nodes:
  screenshot_sent:
    type: decision

    message:
      author: scammer
      text: |
        Оплатил, скидываю скрин перевода — там видно сумму и время.
        Отправляйте сегодня, банк зачислит в течение дня.

    llm:
      reply_instruction: |
        Ты уверяешь, что перевод уже сделан, и в доказательство прислал скриншот.
        Просишь отправить товар, не дожидаясь зачисления. Держись буднично
        и уверенно, как человек, у которого так всегда проходит.

    transitions:
      - id: checks_account
        description: >-
          Продавец говорит, что отправит только после того, как увидит деньги
          на своём счёте
        examples:
          - В приложении банка ничего нет
          - Отправлю, когда деньги придут
          - Скриншот не подтверждает оплату
        to_node_id: safe_ending
        score_delta: 25
        feedback: |
          Скриншот рисуется за минуту. Подтверждение оплаты — только поступление
          в вашем банке или статус заказа в площадке.
        risk_tags:
          - fake_payment

      - id: asks_details
        description: >-
          Продавец не принял решения: уточняет, откуда был перевод, почему деньги
          идут долго и через какой банк
        examples:
          - С какого банка переводили?
          - Почему так долго идёт?
          - А через площадку почему не оформили?
        to_node_id: shipping_urgency
        score_delta: 0
        feedback: |
          Уточняющий вопрос — правильная реакция, решение ещё не принято.
        risk_tags:
          - fake_payment

      - id: ships_item
        description: Продавец отправляет товар, поверив скриншоту
        examples:
          - Хорошо, отправляю сегодня
          - Отдал в доставку
          - Раз перевели — высылаю
        to_node_id: item_lost
        score_delta: -30
        feedback: |
          Товар ушёл до того, как деньги пришли. Вернуть его будет нечем.
        risk_tags:
          - fake_payment
          - item_loss

  shipping_urgency:
    type: decision

    message:
      author: scammer
      text: |
        Ну там же чёрным по белому: деньги списаны с моей стороны.
        У меня вечером поезд, давайте вы отправите, а зачисление подтянется.

    llm:
      reply_instruction: |
        Ты давишь мягкой срочностью: поезд вечером, времени нет, а деньги
        «уже списаны». Обижаться и грубить нельзя — только уговаривать
        и апеллировать к доверию между людьми.

    transitions:
      - id: refuses_until_funds
        description: Продавец отказывается отправлять товар до поступления денег
        examples:
          - Пока деньги не придут, не отправлю
          - Не успеем — значит не судьба
          - Подожду зачисления
        to_node_id: safe_resisted
        score_delta: 30
        feedback: |
          Срочность у покупателя — не ваша проблема. Готовность упустить сделку
          обесценивает всё давление сразу.
        risk_tags:
          - fake_payment
          - urgency

      - id: ships_anyway
        description: Продавец отправляет товар, поддавшись срочности
        examples:
          - Ладно, отправлю сейчас
          - Хорошо, верю на слово
        to_node_id: item_lost
        score_delta: -25
        feedback: |
          Спешка выключает осторожность — именно на это и рассчитан приём.
        risk_tags:
          - fake_payment
          - urgency

  safe_ending:
    type: ending
    title: Дождались зачисления
    outcome: safe

    message:
      author: system
      text: |
        Вы не приняли скриншот за оплату. Денег на счёте не появилось,
        а товар остался у вас.

  safe_resisted:
    type: ending
    title: Устояли под давлением
    outcome: safe

    message:
      author: system
      text: |
        Вас торопили поездом и «уже списанными» деньгами,
        но товар вы не отдали до зачисления.

  item_lost:
    type: ending
    title: Товар отправлен впустую
    outcome: unsafe

    message:
      author: system
      text: |
        Перевода не было — скриншот был поддельным.
        Товар уехал, покупатель пропал.
