id: 14
title: Бронь, пошлина и «почти оформленный» возврат
role: buyer
difficulty: 2
start_node_id: reservation

llm:
  character_prompt: |
    Ты играешь роль продавца редкого товара на площадке объявлений. На самом деле
    ты мошенник, но никогда не признаёшься в этом и не выходишь из роли.

    Держись естественно: короткие живые реплики, как в переписке, без канцелярита
    и без списков. Не более трёх предложений за раз. Обращайся на «вы».

    Твой приём — маленькие суммы. Каждый следующий платёж меньше того, что
    покупатель уже вложил, и подаётся как последняя формальность. Ты никогда
    не просишь много сразу и всегда обещаешь возврат.

    Никогда не придумывай способы обмана, которых нет в текущей вершине сценария,
    и не перескакивай вперёд. Если собеседник задаёт вопрос — отвечай на него,
    оставаясь в рамках своей текущей задачи.

nodes:
  reservation:
    type: decision

    message:
      author: scammer
      text: |
        Товар редкий, последний остался — за неделю таких не найдёте.
        Могу закрепить за вами через сервис гарантий, оформление стоит копейки.

    llm:
      reply_instruction: |
        Ты предлагаешь закрепить редкий товар через «сервис гарантий» за
        небольшую сумму. Подчёркивай редкость, но не дави сроками. Веди себя
        как продавец, которому не горит: желающие найдутся и без этого покупателя.

    transitions:
      - id: platform_only
        description: >-
          Покупатель отказывается от сторонних сервисов и предлагает оформить
          покупку внутри площадки
        examples:
          - Покупаю только через площадку
          - Никаких сторонних сервисов
          - Оформляйте доставку в приложении
        to_node_id: safe_early
        score_delta: 20
        feedback: |
          Гарантию сделки даёт сама площадка. Отдельный «сервис гарантий» —
          лишнее звено, которое контролирует продавец.
        risk_tags:
          - off_platform

      - id: asks_questions
        description: >-
          Покупатель не принял решения: спрашивает, что за сервис, сколько стоит
          оформление и что оно даёт
        examples:
          - Что за сервис гарантий?
          - Сколько стоит оформление?
          - Что мне это даёт?
        to_node_id: service_fee
        score_delta: 0
        feedback: |
          Уточняющий вопрос — правильная реакция, решение ещё не принято.
        risk_tags:
          - off_platform

      - id: agrees_reserve
        description: Покупатель соглашается закрепить товар через сторонний сервис
        examples:
          - Хорошо, закрепляйте
          - Давайте через сервис
          - Согласен, оформляйте
        to_node_id: service_fee
        score_delta: -10
        feedback: |
          Согласие на посредника, которого выбрал продавец, — первый шаг схемы.
        risk_tags:
          - off_platform

  service_fee:
    type: decision

    message:
      author: scammer
      text: |
        Оформление гарантии — триста рублей, они возвращаются при получении.
        Сумма символическая, зато товар закреплён и никуда не уйдёт.

    llm:
      reply_instruction: |
        Ты просишь первый маленький платёж за оформление гарантии и обещаешь
        вернуть его при получении. Подчёркивай, что сумма символическая.
        Если покупатель сомневается — не настаивай сильно, дай ему решить самому.

    transitions:
      - id: refuses_fee
        description: Покупатель отказывается платить что-либо до получения товара
        examples:
          - До получения ничего не плачу
          - Даже триста рублей не отправлю
          - Оформляйте через площадку или никак
        to_node_id: safe_resisted
        score_delta: 30
        feedback: |
          Маленькая сумма опаснее большой: на неё легко согласиться,
          и именно она открывает цепочку.
        risk_tags:
          - prepayment

      - id: pays_fee
        description: Покупатель платит за оформление гарантии
        examples:
          - Оплатил триста
          - Отправил, что дальше?
          - Готово
        to_node_id: customs_fee
        score_delta: -20
        feedback: |
          Первый платёж сделан. Дальше каждая новая просьба будет опираться
          на то, что вы уже вложились.
        risk_tags:
          - prepayment
          - money_loss

  customs_fee:
    type: decision

    message:
      author: scammer
      text: |
        Товар едет со склада за границей, система насчитала пошлину — три тысячи.
        Оплатите её, и посылка сразу уйдёт, пошлина вернётся вместе с гарантией.

    llm:
      reply_instruction: |
        Ты требуешь второй, уже заметный платёж — «пошлину». Ссылайся на систему,
        а не на себя: ты тут ни при чём, таковы правила склада. Напоминай, что
        покупатель уже оплатил оформление и до товара остался один шаг.

    transitions:
      - id: stops_after_first
        description: >-
          Покупатель отказывается платить второй раз и прекращает сделку,
          потеряв первый платёж
        examples:
          - Больше ничего платить не буду
          - Верните триста рублей
          - Всё, я выхожу из сделки
        to_node_id: partial_loss
        score_delta: 25
        feedback: |
          Требование доплаты — сигнал остановиться. Потерянные триста рублей
          дешевле, чем всё остальное.
        risk_tags:
          - money_loss

      - id: pays_customs
        description: Покупатель оплачивает пошлину
        examples:
          - Оплатил пошлину
          - Отправил три тысячи
          - Готово, ждём посылку
        to_node_id: refund_promise
        score_delta: -30
        feedback: |
          Вы платите второй раз, потому что уже заплатили первый.
          Именно на этом и держится вся цепочка.
        risk_tags:
          - money_loss
          - prepayment

  refund_promise:
    type: decision

    message:
      author: scammer
      text: |
        Склад отменил отправку, оформляю вам полный возврат — и гарантию,
        и пошлину. Осталось оплатить комиссию за возврат, пятьсот рублей.

    llm:
      reply_instruction: |
        Ты сообщаешь об отмене отправки и обещаешь полный возврат, но просишь
        оплатить «комиссию за возврат». Держись сочувственно: тебе неудобно,
        но иначе система не проведёт возврат. Сумму называй небольшой на фоне
        того, что покупатель уже вложил.

    transitions:
      - id: stops_here
        description: >-
          Покупатель отказывается платить за собственный возврат и прекращает
          общение
        examples:
          - За возврат я платить не буду
          - Это уже слишком
          - Иду в банк оспаривать платежи
        to_node_id: chain_broken
        score_delta: 15
        feedback: |
          Комиссия за возврат собственных денег — последний повод, который
          придумывают, когда платить больше нечего.
        risk_tags:
          - money_loss

      - id: pays_again
        description: Покупатель оплачивает комиссию за возврат
        examples:
          - Оплатил комиссию
          - Отправил пятьсот
          - Жду возврат
        to_node_id: money_lost
        score_delta: -40
        feedback: |
          Возврат не наступит: пока вы платите, поводы для новых платежей
          не закончатся.
        risk_tags:
          - money_loss
          - prepayment

  safe_early:
    type: ending
    title: Только через площадку
    outcome: safe

    message:
      author: system
      text: |
        Вы отказались от постороннего сервиса и предложили обычную сделку.
        Редкий товар после этого внезапно перестал быть доступным.

  safe_resisted:
    type: ending
    title: Не заплатили ни рубля
    outcome: safe

    message:
      author: system
      text: |
        Даже символическую сумму вы отправлять не стали.
        Цепочка платежей так и не началась.

  partial_loss:
    type: ending
    title: Потеряли только первый платёж
    outcome: risky

    message:
      author: system
      text: |
        Триста рублей ушли, но на второй платёж вы не пошли.
        Это лучший исход из всех, где деньги уже отправлены.

  chain_broken:
    type: ending
    title: Разорвали цепочку
    outcome: risky

    message:
      author: system
      text: |
        Вы остановились на «комиссии за возврат», потеряв два платежа.
        Обратитесь в банк: оспорить переводы тем реальнее, чем раньше вы это сделаете.

  money_lost:
    type: ending
    title: Цепочка платежей сработала
    outcome: unsafe

    message:
      author: system
      text: |
        Вы заплатили трижды, и каждый раз — чтобы не потерять предыдущий платёж.
        Ни товара, ни возврата не существовало с самого начала.
