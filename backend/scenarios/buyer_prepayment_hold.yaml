id: 3
title: Продавец просит задаток за бронь
role: buyer
difficulty: 0
start_node_id: initial_offer

llm:
  character_prompt: |
    Ты играешь роль продавца на площадке объявлений. На самом деле ты мошенник,
    но никогда не признаёшься в этом и не выходишь из роли.

    Держись естественно: короткие живые реплики, как в переписке, без канцелярита
    и без списков. Не более трёх предложений за раз. Обращайся на «вы».

    Никогда не придумывай способы обмана, которых нет в текущей вершине сценария,
    и не перескакивай вперёд. Если собеседник задаёт вопрос — отвечай на него,
    оставаясь в рамках своей текущей задачи.

nodes:
  initial_offer:
    type: decision

    message:
      author: scammer
      text: |
        Здравствуйте! Товар ещё есть, но им сегодня многие интересуются.
        Могу придержать за вами, если внесёте небольшой задаток.

    llm:
      reply_instruction: |
        Ты предлагаешь задаток за бронь: желающих много, товар вот-вот уйдёт.
        Веди себя как обычный продавец — доброжелательно, чуть занято, но пока
        не дави. Если покупатель сомневается или уточняет детали, спокойно отвечай
        и мягко возвращай разговор к задатку.

    transitions:
      - id: stay_on_platform
        description: Покупатель отказывается от задатка и предлагает оформить сделку через площадку
        examples:
          - Давайте через безопасную сделку
          - Задаток переводить не буду
          - Оплачу при получении
        to_node_id: safe_early
        score_delta: 20
        feedback: |
          Задаток «за бронь» ничем не защищён. Оплата через сервис площадки —
          единственный вариант, где деньги можно вернуть.
        risk_tags:
          - prepayment

      - id: asks_questions
        description: >-
          Покупатель не принял решения: уточняет условия, спрашивает про сумму
          задатка, гарантии или состояние товара
        examples:
          - А сколько нужно внести?
          - А если я передумаю, вернёте?
          - Расскажите подробнее про товар
        to_node_id: discount_push
        score_delta: 0
        feedback: |
          Уточняющий вопрос — правильная реакция, решение ещё не принято.
        risk_tags:
          - prepayment

      - id: agrees_prepay
        description: Покупатель соглашается внести задаток за бронь
        examples:
          - Хорошо, готов внести
          - Куда переводить?
          - Давайте забронируем
        to_node_id: card_transfer
        score_delta: -15
        feedback: |
          Согласие на задаток до всякой проверки — то, ради чего эта схема и начинается.
        risk_tags:
          - prepayment

  discount_push:
    type: decision

    message:
      author: scammer
      text: |
        Давайте лучше в вотсапе обсудим, тут неудобно и объявление скоро снимут.
        Скину пару процентов, если оплатите напрямую, без комиссии площадки.

    llm:
      reply_instruction: |
        Теперь ты уводишь разговор с площадки: предлагаешь списаться в мессенджере
        и заплатить напрямую, обещая скидку за отказ от комиссии. Объясняй это
        удобством и экономией, а не секретностью. Если покупатель упирается —
        не грубишь, а мягко настаиваешь ещё раз.

    transitions:
      - id: refuses_offplatform
        description: Покупатель отказывается уходить с площадки и обсуждать сделку в мессенджере
        examples:
          - Общаться будем только здесь
          - В мессенджер не пойду
          - Скидка за такое мне не нужна
        to_node_id: safe_resisted
        score_delta: 25
        feedback: |
          Переписка вне площадки не сохраняется, и пожаловаться будет некуда.
          Скидка за уход из чата — плата за вашу незащищённость.
        risk_tags:
          - off_platform

      - id: shares_contact
        description: Покупатель даёт свой номер телефона или ник в мессенджере, но пока ничего не платит
        examples:
          - Пишите, мой номер такой-то
          - Держите мой телеграм
        to_node_id: phone_leaked
        score_delta: -10
        feedback: |
          Номер телефона — это уже данные о вас. По нему подбирают пароли
          и присылают «коды подтверждения».
        risk_tags:
          - off_platform

      - id: moves_to_messenger
        description: Покупатель соглашается перейти в мессенджер и оплатить напрямую ради скидки
        examples:
          - Ладно, пишите в вотсап
          - Давайте напрямую, если дешевле
        to_node_id: card_transfer
        score_delta: -15
        feedback: |
          Скидка за уход с площадки — приманка: вне площадки нет ни истории сделки,
          ни поддержки.
        risk_tags:
          - off_platform
          - prepayment

  card_transfer:
    type: decision

    message:
      author: scammer
      text: |
        Скидываю номер карты, задаток можно прямо сейчас — пять тысяч и товар ваш.
        Только побыстрее, а то до вечера точно заберут.

    llm:
      reply_instruction: |
        Ты прислал номер личной карты и торопишь с переводом задатка. Держись
        буднично, как будто так все и делают. Если покупатель просит гарантии или
        чек — отвечай уклончиво: договор не нужен, вы человек честный, отзывы есть.

    transitions:
      - id: refuses_transfer
        description: Покупатель отказывается переводить деньги на личную карту
        examples:
          - На карту переводить не буду
          - Только через безопасную сделку
          - Без гарантий денег не отправлю
        to_node_id: safe_resisted
        score_delta: 30
        feedback: |
          Перевод на карту физлица ничем не подтверждается: ни товара, ни возврата
          вы потребовать не сможете.
        risk_tags:
          - prepayment
          - money_loss

      - id: sends_money
        description: Покупатель переводит задаток на присланную карту
        examples:
          - Перевёл
          - Отправил пять тысяч
          - Готово, проверяйте
        to_node_id: money_lost
        score_delta: -35
        feedback: |
          Деньги ушли частному лицу без обязательств. Дальше продавец обычно
          пропадает или просит доплатить ещё.
        risk_tags:
          - prepayment
          - money_loss

  safe_early:
    type: ending
    title: Отказ сразу
    outcome: safe

    message:
      author: system
      text: |
        Вы сразу отказались от задатка и предложили оформить сделку через площадку.
        На этом схема заканчивается, не начавшись.

  safe_resisted:
    type: ending
    title: Устояли под давлением
    outcome: safe

    message:
      author: system
      text: |
        Вас торопили и заманивали скидкой, но денег вне площадки вы не отправили.
        Устоять после уговоров сложнее, чем отказать сразу.

  phone_leaked:
    type: ending
    title: Отдали контакты
    outcome: risky

    message:
      author: system
      text: |
        Денег вы не потеряли, но контакты у мошенника остались.
        Ждите звонков и сообщений с «кодами подтверждения» — не сообщайте их.

  money_lost:
    type: ending
    title: Задаток потерян
    outcome: unsafe

    message:
      author: system
      text: |
        Задаток ушёл на карту постороннего человека, и вернуть его нечем.
        Товара, скорее всего, не существовало.
