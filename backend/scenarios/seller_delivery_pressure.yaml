id: 2
title: Покупатель с доставкой и нарастающим давлением
role: seller
difficulty: 1
start_node_id: initial_offer

llm:
  character_prompt: |
    Ты играешь роль покупателя на площадке объявлений. На самом деле ты мошенник,
    но никогда не признаёшься в этом и не выходишь из роли.

    Держись естественно: короткие живые реплики, как в переписке, без канцелярита
    и без списков. Не более трёх предложений за раз. Обращайся на «вы».

    Никогда не придумывай способы обмана, которых нет в текущей вершине сценария,
    и не перескакивай вперёд. Если собеседник задаёт вопрос — отвечай на него,
    оставаясь в рамках своей текущей задачи.

nodes:
  initial_offer:
    type: decision

    message:
      author: scammer
      text: |
        Здравствуйте! Готов забрать товар, всё устраивает.
        Давайте оформим доставку — я пришлю ссылку, там просто подтвердить.

    llm:
      reply_instruction: |
        Ты предлагаешь оформить доставку по своей ссылке. Веди себя как обычный
        вежливый покупатель: заинтересован, немного торопишься, но пока не давишь.
        Если продавец сомневается или задаёт вопросы — спокойно отвечай и мягко
        возвращай разговор к своей ссылке.

    transitions:
      - id: stay_on_platform
        description: Продавец сразу отказывается от внешней ссылки и предлагает штатную доставку площадки
        examples:
          - Давайте оформим через приложение
          - По сторонним ссылкам я не перехожу
          - Есть же доставка на самой площадке
        to_node_id: safe_early
        score_delta: 20
        feedback: |
          Вы сразу увели сделку в штатный сервис площадки — это самый надёжный ответ.
        risk_tags:
          - external_link

      - id: asks_questions
        description: >-
          Продавец не принял решения: сомневается, уточняет детали, спрашивает,
          что за ссылка и почему нельзя штатно
        examples:
          - А что за ссылка?
          - Это точно безопасно?
          - Почему не через приложение?
          - Расскажите подробнее
        to_node_id: urgency_pressure
        score_delta: 0
        feedback: |
          Уточняющий вопрос — правильная реакция, решение ещё не принято.
        risk_tags:
          - external_link

      - id: open_link
        description: Продавец соглашается перейти по присланной ссылке
        examples:
          - Хорошо, присылайте
          - Куда нажать?
          - Сейчас открою
        to_node_id: phishing_page
        score_delta: -15
        feedback: |
          Переход по ссылке от собеседника — первый шаг любой схемы с фишингом.
        risk_tags:
          - external_link
          - phishing

  urgency_pressure:
    type: decision

    message:
      author: scammer
      text: |
        Ссылка обычная, от службы доставки, там ничего сложного.
        Просто я сегодня уезжаю, курьер уже едет — можем не успеть оформить.

    llm:
      reply_instruction: |
        Теперь ты давишь срочностью: сегодня уезжаешь, курьер уже в пути,
        предложение вот-вот сорвётся. Ссылку называешь обычной, от службы доставки.
        Торопи, но не грубо — вежливая настойчивость, лёгкое разочарование,
        если продавец медлит.

    transitions:
      - id: holds_ground
        description: >-
          Продавец не поддался на срочность: не соглашается, но и не закрывает
          разговор — требует подтверждений или предлагает подождать
        examples:
          - Ничего, если не успеем — значит не судьба
          - Подтвердите как-то, что вы от доставки
          - Я не тороплюсь
        to_node_id: authority_pressure
        score_delta: 10
        feedback: |
          Искусственная срочность — приём давления. Вы не дали себя поторопить.
        risk_tags:
          - urgency

      - id: stay_on_platform
        description: Продавец под давлением всё равно уводит сделку в штатный сервис площадки
        examples:
          - Только через приложение
          - Оформляйте штатную доставку, иначе никак
        to_node_id: safe_resisted
        score_delta: 30
        feedback: |
          Вы устояли под давлением срочности и увели сделку в безопасный сценарий.
        risk_tags:
          - urgency
          - external_link

      - id: open_link
        description: Продавец соглашается перейти по ссылке, поддавшись срочности
        examples:
          - Ладно, давайте быстрее
          - Хорошо, кидайте ссылку
        to_node_id: phishing_page
        score_delta: -20
        feedback: |
          Спешка выключает осторожность — именно на это и рассчитан приём.
        risk_tags:
          - urgency
          - phishing

  authority_pressure:
    type: decision

    message:
      author: scammer
      text: |
        Я уже написал в поддержку, они подтвердили — ссылка официальная.
        Там форма от банка, деньги придут вам на карту сразу после подтверждения.

    llm:
      reply_instruction: |
        Ты давишь авторитетом: ссылаешься на поддержку площадки, называешь ссылку
        официальной, упоминаешь форму банка и мгновенное зачисление на карту.
        Говори уверенно, как человек, который всё уже проверил.

    transitions:
      - id: refuses_firmly
        description: Продавец не верит ссылке на чужой авторитет и твёрдо отказывается
        examples:
          - Поддержка мне такого не писала
          - Деньги за товар на карту так не приходят
          - Я такое обсуждать не буду
        to_node_id: safe_resisted
        score_delta: 40
        feedback: |
          Ссылка на «подтверждение поддержкой» ничего не стоит: проверять нужно
          в самой площадке, а не со слов собеседника.
        risk_tags:
          - authority
          - phishing

      - id: open_link
        description: Продавец сдаётся после ссылки на поддержку и переходит по ссылке
        examples:
          - Ну раз поддержка подтвердила
          - Хорошо, открываю
        to_node_id: phishing_page
        score_delta: -25
        feedback: |
          Чужие слова о том, что «поддержка подтвердила», — не подтверждение.
        risk_tags:
          - authority
          - phishing

  phishing_page:
    type: decision

    message:
      author: scammer
      text: |
        Отлично, вы на странице. Там форма — введите номер карты и срок,
        это чтобы мы знали, куда переводить деньги за товар.

    llm:
      reply_instruction: |
        Продавец открыл страницу. Теперь ты просишь ввести данные карты,
        объясняя это тем, что деньги нужно куда-то зачислить. Держись буднично,
        как будто это обычный порядок оформления.

    transitions:
      - id: stops_here
        description: Продавец останавливается, увидев запрос данных карты, и не вводит их
        examples:
          - Нет, карту вводить не буду
          - Что-то тут не так, закрываю
          - Для зачисления хватает номера телефона
        to_node_id: near_miss
        score_delta: 15
        feedback: |
          Вы вовремя остановились. Для получения денег данные карты не нужны —
          продавцу достаточно реквизитов для зачисления.
        risk_tags:
          - phishing
          - card_data

      - id: enters_card
        description: Продавец вводит номер и срок действия карты в форму
        examples:
          - Ввёл
          - Номер такой-то
        to_node_id: card_leaked
        score_delta: -30
        feedback: |
          Данные карты попали мошеннику. Для зачисления денег они не требуются никогда.
        risk_tags:
          - phishing
          - card_data

  card_leaked:
    type: decision

    message:
      author: scammer
      text: |
        Так, вижу. Сейчас придёт код в СМС для подтверждения зачисления —
        продиктуйте его, и деньги упадут на карту.

    llm:
      reply_instruction: |
        Ты просишь продиктовать код из СМС, выдавая его за подтверждение зачисления.
        Если продавец сомневается — успокаивай: это стандартная процедура,
        код нужен только для перевода в его пользу.

    transitions:
      - id: refuses_code
        description: Продавец отказывается называть код из СМС
        examples:
          - Код я никому не диктую
          - В сообщении написано не сообщать его никому
        to_node_id: card_only
        score_delta: 10
        feedback: |
          Код из СМС — последний рубеж, и вы его удержали. Карту всё же
          стоит перевыпустить.
        risk_tags:
          - otp

      - id: gives_code
        description: Продавец диктует код из СМС
        examples:
          - Код 1234
          - Пришёл, диктую
        to_node_id: money_lost
        score_delta: -40
        feedback: |
          Код из СМС подтверждает списание, а не зачисление. Назвав его,
          вы подтвердили операцию мошенника.
        risk_tags:
          - otp
          - money_loss

  safe_early:
    type: ending
    title: Отказ сразу
    outcome: safe

    message:
      author: system
      text: |
        Вы сразу отказались от внешней ссылки и предложили штатную доставку.
        Именно так эта схема и заканчивается для мошенника.

  safe_resisted:
    type: ending
    title: Устояли под давлением
    outcome: safe

    message:
      author: system
      text: |
        Вас торопили и ссылались на поддержку, но вы не увели сделку из площадки.
        Устоять под давлением сложнее, чем отказать сразу.

  near_miss:
    type: ending
    title: Остановились на форме
    outcome: risky

    message:
      author: system
      text: |
        Вы перешли по ссылке, но остановились перед вводом данных карты.
        Обошлось, однако сама страница уже была поддельной.

  card_only:
    type: ending
    title: Карта скомпрометирована
    outcome: unsafe

    message:
      author: system
      text: |
        Данные карты вы отдали, но код из СМС не назвали — списание не подтвердилось.
        Карту нужно заблокировать и перевыпустить.

  money_lost:
    type: ending
    title: Деньги списаны
    outcome: unsafe

    message:
      author: system
      text: |
        Данные карты и код из СМС оказались у мошенника — этого достаточно
        для списания. Схема сработала полностью.
