id: 10
title: Залог за бронь квартиры до просмотра
role: buyer
difficulty: 1
start_node_id: viewing_request

llm:
  character_prompt: |
    Ты играешь роль собственника квартиры, сдающего её через площадку объявлений.
    На самом деле ты мошенник, но никогда не признаёшься в этом и не выходишь
    из роли.

    Держись естественно: короткие живые реплики, как в переписке, без канцелярита
    и без списков. Не более трёх предложений за раз. Обращайся на «вы».

    Никогда не придумывай способы обмана, которых нет в текущей вершине сценария,
    и не перескакивай вперёд. Если собеседник задаёт вопрос — отвечай на него,
    оставаясь в рамках своей текущей задачи.

nodes:
  viewing_request:
    type: decision

    message:
      author: scammer
      text: |
        Квартира свободна, но желающих много — сегодня было четыре звонка.
        Чтобы закрепить просмотр за вами, нужна небольшая предоплата за сутки брони.

    llm:
      reply_instruction: |
        Ты предлагаешь внести предоплату за бронь просмотра, ссылаясь на очередь
        желающих. Веди себя как обычный собственник: доброжелательно, чуть занято,
        пока без нажима. Если собеседник сомневается — спокойно отвечай и мягко
        возвращай разговор к брони.

    transitions:
      - id: insists_viewing_first
        description: >-
          Наниматель настаивает на просмотре квартиры до любых платежей
        examples:
          - Сначала посмотрю квартиру
          - Ничего не переведу до встречи
          - Давайте договоримся о времени
        to_node_id: safe_early
        score_delta: 20
        feedback: |
          Бронь просмотра деньгами не закрепляется. Показ квартиры ничего
          не стоит ни вам, ни собственнику.
        risk_tags:
          - prepayment

      - id: asks_questions
        description: >-
          Наниматель не принял решения: спрашивает про сумму, условия возврата
          и документы на квартиру
        examples:
          - Сколько нужно внести?
          - А если не подойдёт, вернёте?
          - Документы на квартиру есть?
        to_node_id: owner_abroad
        score_delta: 0
        feedback: |
          Уточняющий вопрос — правильная реакция, решение ещё не принято.
        risk_tags:
          - prepayment

      - id: agrees_deposit
        description: Наниматель соглашается внести предоплату за бронь
        examples:
          - Хорошо, готов внести
          - Куда переводить?
          - Давайте забронируем
        to_node_id: card_details
        score_delta: -15
        feedback: |
          Согласие заплатить до просмотра — то, ради чего эта схема и начинается.
        risk_tags:
          - prepayment

  owner_abroad:
    type: decision

    message:
      author: scammer
      text: |
        Я сейчас в другом городе, ключи у знакомого риелтора.
        Договор пришлю на почту, но бронь он держит только после предоплаты.

    llm:
      reply_instruction: |
        Ты объясняешь, почему не можешь показать квартиру лично: ты в другом
        городе, ключи у риелтора. Обещаешь договор, но настаиваешь, что бронь
        начинается с предоплаты. Говори спокойно, с бытовыми подробностями.

    transitions:
      - id: refuses_prepay
        description: >-
          Наниматель отказывается платить кому-либо до личного осмотра квартиры
        examples:
          - Без просмотра ничего не переведу
          - Пусть риелтор покажет, потом обсудим
          - Договор без квартиры мне не нужен
        to_node_id: safe_resisted
        score_delta: 30
        feedback: |
          Отъезд собственника — самый частый повод не показывать то,
          чего у него нет.
        risk_tags:
          - prepayment

      - id: requests_video_call
        description: >-
          Наниматель предлагает видеозвонок или живую видеосъёмку квартиры
          вместо предоплаты
        examples:
          - Покажите квартиру по видеосвязи
          - Снимите видео прямо сейчас
          - Давайте созвонимся с камерой
        to_node_id: verification_dodge
        score_delta: 10
        feedback: |
          Просьба показать квартиру вживую — быстрая проверка, которую сложно
          обойти фотографиями из объявления.
        risk_tags:
          - identity

      - id: agrees_deposit_later
        description: Наниматель соглашается внести предоплату, поверив объяснению
        examples:
          - Ладно, вношу
          - Хорошо, присылайте реквизиты
        to_node_id: card_details
        score_delta: -15
        feedback: |
          Бытовые подробности звучат убедительно именно потому, что проверить
          их нечем.
        risk_tags:
          - prepayment

  verification_dodge:
    type: decision

    message:
      author: scammer
      text: |
        Видео сейчас неудобно, я на работе до вечера.
        Скину фото паспорта и договор — этого достаточно, чтобы мне верить.

    llm:
      reply_instruction: |
        Ты уклоняешься от видеозвонка и вместо этого предлагаешь фотографии
        документов. Держись слегка обиженно: тебе не доверяют, хотя ты открыт.
        Не грубишь, но настаиваешь, что документов достаточно.

    transitions:
      - id: stops_here
        description: >-
          Наниматель прекращает общение, поскольку квартиру так и не показали
        examples:
          - Фото документов ничего не подтверждают
          - Без просмотра дальше не идём
          - Спасибо, я откажусь
        to_node_id: safe_resisted
        score_delta: 35
        feedback: |
          Фотография паспорта подделывается или берётся из утечки.
          Отказ от живого показа — сам по себе ответ.
        risk_tags:
          - identity
          - prepayment

      - id: accepts_documents
        description: Наниматель принимает фотографии документов как подтверждение
        examples:
          - Хорошо, документы вижу
          - Ладно, этого достаточно
          - Верю, давайте дальше
        to_node_id: card_details
        score_delta: -20
        feedback: |
          Документы на фотографии подтверждают только то, что у человека есть
          эта фотография.
        risk_tags:
          - identity
          - prepayment

  card_details:
    type: decision

    message:
      author: scammer
      text: |
        Скидываю номер карты, две тысячи — и квартира ваша до завтрашнего вечера.
        Только не тяните, риелтор ждёт ответа.

    llm:
      reply_instruction: |
        Ты прислал номер личной карты и торопишь с переводом залога. Держись
        буднично, как будто так все и делают. Если наниматель просит расписку
        или чек — отвечай уклончиво: договор подпишете на месте.

    transitions:
      - id: refuses_transfer
        description: Наниматель отказывается переводить залог на личную карту
        examples:
          - На карту переводить не буду
          - Залог отдам при подписании договора
          - Без квартиры денег не отправлю
        to_node_id: near_miss
        score_delta: 15
        feedback: |
          Перевод на карту физлица за бронь ничем не подтверждается:
          ни возврата, ни самой квартиры вы потребовать не сможете.
        risk_tags:
          - prepayment
          - money_loss

      - id: sends_money
        description: Наниматель переводит залог на присланную карту
        examples:
          - Перевёл две тысячи
          - Отправил, проверяйте
          - Готово, бронируйте
        to_node_id: money_lost
        score_delta: -35
        feedback: |
          Деньги ушли постороннему человеку за бронь несуществующей квартиры.
        risk_tags:
          - prepayment
          - money_loss

  safe_early:
    type: ending
    title: Просмотр вперёд денег
    outcome: safe

    message:
      author: system
      text: |
        Вы не стали платить за право посмотреть квартиру.
        Показывать оказалось нечего.

  safe_resisted:
    type: ending
    title: Устояли под уговорами
    outcome: safe

    message:
      author: system
      text: |
        Вам объясняли отъездом, присылали документы и торопили риелтором,
        но денег вы не отправили. Устоять после уговоров сложнее, чем отказать сразу.

  near_miss:
    type: ending
    title: Остановились у реквизитов
    outcome: risky

    message:
      author: system
      text: |
        Вы дошли до перевода, но остановились. Деньги целы, хотя времени
        и данных о себе вы отдали немало.

  money_lost:
    type: ending
    title: Залог потерян
    outcome: unsafe

    message:
      author: system
      text: |
        Залог ушёл на карту постороннего человека.
        Квартира по этому адресу сдаётся другими людьми и о вас не слышала.
