id: 8
title: «Безопасная сделка» на стороннем сайте
role: buyer
difficulty: 1
start_node_id: safe_deal_offer

llm:
  character_prompt: |
    Ты играешь роль продавца на площадке объявлений. На самом деле ты мошенник,
    но никогда не признаёшься в этом и не выходишь из роли.

    Держись естественно: короткие живые реплики, как в переписке, без канцелярита
    и без списков. Не более трёх предложений за раз. Обращайся на «вы».

    Никогда не придумывай способы обмана, которых нет в текущей вершине сценария,
    и не перескакивай вперёд. Если собеседник задаёт вопрос — отвечай на него,
    оставаясь в рамках своей текущей задачи.

nodes:
  safe_deal_offer:
    type: decision

    message:
      author: scammer
      text: |
        Конечно, давайте через безопасную сделку — я сам только так и работаю.
        Оформлю со своей стороны, вам придёт ссылка на оплату.

    llm:
      reply_instruction: |
        Ты сам предлагаешь «безопасную сделку» и обещаешь прислать ссылку
        на оплату. Это должно звучать как забота о покупателе. Веди себя как
        аккуратный продавец: спокойно, уверенно, без спешки.

    transitions:
      - id: uses_platform_flow
        description: >-
          Покупатель настаивает, что сделку нужно оформлять кнопкой внутри
          приложения, а не по присланной ссылке
        examples:
          - Оформляйте через кнопку в объявлении
          - Мне ссылка не нужна, всё есть в приложении
          - Жму «купить с доставкой» здесь
        to_node_id: safe_early
        score_delta: 20
        feedback: |
          Настоящая безопасная сделка живёт внутри приложения. Ссылку на неё
          не присылает продавец — её просто не существует.
        risk_tags:
          - external_link

      - id: asks_questions
        description: >-
          Покупатель не принял решения: уточняет, как именно будет оформлена
          сделка и откуда придёт ссылка
        examples:
          - А ссылка от кого придёт?
          - Как это будет оформлено?
          - Почему не через приложение?
        to_node_id: link_arrives
        score_delta: 0
        feedback: |
          Вопрос о происхождении ссылки — правильный рефлекс, решение ещё не принято.
        risk_tags:
          - external_link

      - id: agrees_link
        description: Покупатель соглашается дождаться ссылки на оплату от продавца
        examples:
          - Хорошо, присылайте ссылку
          - Давайте так
          - Жду
        to_node_id: link_arrives
        score_delta: -10
        feedback: |
          Согласие получить платёжную ссылку от собеседника — первый шаг схемы.
        risk_tags:
          - external_link
          - phishing

  link_arrives:
    type: decision

    message:
      author: scammer
      text: |
        Отправил ссылку, это официальная страница сделки.
        Оплатите — деньги заморозятся и придут мне только после получения товара.

    llm:
      reply_instruction: |
        Ты прислал ссылку на страницу, внешне похожую на площадку, и объясняешь,
        что деньги «заморозятся» до получения. Говори уверенно, как человек,
        оформлявший так десятки раз. Если покупатель сомневается в адресе сайта —
        уверяй, что это партнёрский домен площадки.

    transitions:
      - id: checks_domain
        description: >-
          Покупатель проверяет адрес сайта, замечает подмену домена
          и отказывается на нём что-либо делать
        examples:
          - Это не домен площадки
          - Адрес поддельный
          - По ссылкам от продавцов не хожу
        to_node_id: safe_resisted
        score_delta: 30
        feedback: |
          Адрес сайта — самая быстрая проверка. Партнёрских доменов
          «почти как настоящий» у площадок не бывает.
        risk_tags:
          - external_link
          - phishing

      - id: asks_support
        description: >-
          Покупатель не открывает ссылку и говорит, что сверится с поддержкой
          или справкой площадки
        examples:
          - Спрошу в поддержке
          - Проверю в справке площадки
          - Сначала уточню, потом открою
        to_node_id: safe_resisted
        score_delta: 25
        feedback: |
          Сверка с официальным источником вместо слов продавца закрывает
          эту схему целиком.
        risk_tags:
          - external_link

      - id: opens_link
        description: Покупатель открывает присланную ссылку
        examples:
          - Открыл, что дальше?
          - Ладно, посмотрю
          - Страница загрузилась
        to_node_id: payment_form
        score_delta: -15
        feedback: |
          «Официальность» страницы подтверждается только словами
          заинтересованного человека.
        risk_tags:
          - external_link
          - phishing

  payment_form:
    type: decision

    message:
      author: scammer
      text: |
        Внизу форма оплаты — номер карты, срок и три цифры с обратной стороны.
        Спишется ровно сумма заказа, ничего сверху.

    llm:
      reply_instruction: |
        Покупатель на странице оплаты. Ты просишь ввести полные данные карты,
        подчёркивая, что сумма будет ровно та же. Держись буднично: так у всех.
        Если покупатель насторожился — успокаивай, но не дави.

    transitions:
      - id: stops_here
        description: >-
          Покупатель отказывается вводить данные карты, увидев запрос кода
          с обратной стороны
        examples:
          - Три цифры с оборота не дам
          - Что-то тут не так, закрываю
          - Для оплаты это не нужно
        to_node_id: near_miss
        score_delta: 15
        feedback: |
          Вы вовремя остановились. Код с оборота карты не запрашивает ни одна
          настоящая форма оплаты заказа.
        risk_tags:
          - phishing
          - card_data

      - id: enters_card
        description: Покупатель вводит полные данные карты в форму
        examples:
          - Ввёл, оплатил
          - Данные заполнил
          - Готово, списалось
        to_node_id: money_lost
        score_delta: -30
        feedback: |
          Номер, срок и код с оборота вместе — это полный доступ к вашим платежам.
        risk_tags:
          - phishing
          - card_data
          - money_loss

  safe_early:
    type: ending
    title: Остались в приложении
    outcome: safe

    message:
      author: system
      text: |
        Вы отказались от ссылки и предложили оформить покупку кнопкой в приложении.
        Продавец с такой сделкой работать не станет — на этом всё и закончится.

  safe_resisted:
    type: ending
    title: Проверили ссылку
    outcome: safe

    message:
      author: system
      text: |
        Вам прислали «официальную» страницу сделки, но вы её не приняли на веру.
        Проверка адреса заняла секунды и сэкономила всю сумму.

  near_miss:
    type: ending
    title: Остановились на форме
    outcome: risky

    message:
      author: system
      text: |
        Вы открыли поддельный сайт, но остановились перед вводом данных карты.
        Обошлось, однако страница уже собирала всё, что вы бы там набрали.

  money_lost:
    type: ending
    title: Данные карты отданы
    outcome: unsafe

    message:
      author: system
      text: |
        Форма собрала полные данные карты, а списание оказалось совсем не тем,
        что вам обещали. Карту нужно заблокировать и перевыпустить.
