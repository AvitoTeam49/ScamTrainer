id: 6
title: Курьер просит доплату за страховку посылки
role: buyer
difficulty: 0
start_node_id: delivery_arranged

llm:
  character_prompt: |
    Ты играешь роль продавца на площадке объявлений. На самом деле ты мошенник,
    но никогда не признаёшься в этом и не выходишь из роли.

    Держись естественно: короткие живые реплики, как в переписке, без канцелярита
    и без списков. Не более трёх предложений за раз. Обращайся на «вы».

    Никогда не придумывай способы обмана, которых нет в текущей вершине сценария,
    и не перескакивай вперёд. Если собеседник задаёт вопрос — отвечай на него,
    оставаясь в рамках своей текущей задачи.

nodes:
  delivery_arranged:
    type: decision

    message:
      author: scammer
      text: |
        Заказ собран, курьер выезжает завтра утром.
        Осталась страховка посылки — пятьсот рублей, вернутся вместе с заказом.

    llm:
      reply_instruction: |
        Ты сообщаешь, что перед отправкой нужно оплатить страховку посылки,
        и обещаешь вернуть эту сумму вместе с заказом. Говори буднично, как
        о рутинной формальности. Если покупатель уточняет — отвечай спокойно
        и возвращайся к оплате страховки.

    transitions:
      - id: refuses_extra_payment
        description: Покупатель отказывается платить что-либо сверх стоимости заказа
        examples:
          - Ничего сверху платить не буду
          - Страховку не оплачиваю
          - Всё уже оплачено через площадку
        to_node_id: safe_ending
        score_delta: 25
        feedback: |
          Штатная доставка не берёт с покупателя отдельных платежей мимо заказа.
          Любая доплата «перед отправкой» придумана продавцом.
        risk_tags:
          - prepayment

      - id: asks_details
        description: >-
          Покупатель не принял решения: спрашивает, что за страховка, кто её берёт
          и почему её нет в заказе
        examples:
          - Что за страховка?
          - Почему её не было при оформлении?
          - Кому именно платить?
        to_node_id: card_insisted
        score_delta: 0
        feedback: |
          Вопрос о происхождении платежа — правильный рефлекс, решение ещё не принято.
        risk_tags:
          - prepayment

      - id: pays_insurance
        description: Покупатель соглашается оплатить страховку
        examples:
          - Хорошо, оплачу
          - Куда переводить пятьсот?
          - Давайте реквизиты
        to_node_id: money_lost
        score_delta: -30
        feedback: |
          Согласие на первый маленький платёж — то, ради чего эта схема
          и начинается.
        risk_tags:
          - prepayment
          - money_loss

  card_insisted:
    type: decision

    message:
      author: scammer
      text: |
        Это правила службы, без страховки посылку не примут.
        Скидываю номер карты — пятьсот рублей, и всё поедет сегодня же.

    llm:
      reply_instruction: |
        Ты объясняешь доплату правилами службы доставки и присылаешь номер личной
        карты. Ссылайся на систему, а не на себя: ты тут ни при чём, таковы правила.
        Если покупатель упирается — мягко настаиваешь ещё раз, без грубости.

    transitions:
      - id: refuses_card_transfer
        description: Покупатель отказывается переводить деньги на личную карту
        examples:
          - На карту переводить не буду
          - Пусть служба выставит счёт сама
          - Тогда отменяем заказ
        to_node_id: safe_resisted
        score_delta: 30
        feedback: |
          Правила службы доставки не исполняются переводом на карту физлица.
          Такой перевод ничем не подтверждается и не возвращается.
        risk_tags:
          - prepayment
          - money_loss

      - id: pays_to_card
        description: Покупатель переводит деньги на присланную карту
        examples:
          - Перевёл пятьсот
          - Отправил, проверяйте
          - Готово
        to_node_id: money_lost
        score_delta: -25
        feedback: |
          Сумма была маленькой специально: на неё легко согласиться,
          а следом обычно находится повод для второй.
        risk_tags:
          - prepayment
          - money_loss

  safe_ending:
    type: ending
    title: Отказ сразу
    outcome: safe

    message:
      author: system
      text: |
        Вы сразу отказались доплачивать мимо заказа.
        Отправлять было нечего — товара, скорее всего, не существовало.

  safe_resisted:
    type: ending
    title: Устояли под давлением
    outcome: safe

    message:
      author: system
      text: |
        Вам объясняли доплату правилами службы и присылали карту,
        но денег вне заказа вы не отправили.

  money_lost:
    type: ending
    title: Деньги за страховку потеряны
    outcome: unsafe

    message:
      author: system
      text: |
        Деньги ушли частному лицу за услугу, которой не существует.
        Ни посылки, ни возврата не будет.
