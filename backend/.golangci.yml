run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - revive
    - stylecheck
    - gofmt
    - govet
    - staticcheck
    - errcheck

linters-settings:
  revive:
    rules:
      - name: var-naming
        severity: warning
        arguments: [["ID"], []]
  stylecheck:
    checks: ["all", "-ST1000"]