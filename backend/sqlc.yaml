version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/users/repository/postgres/queries.sql"
    schema: "migrations/migrations"
    gen:
      go:
        package: "postgres"
        sql_package: "pgx/v5"
        out: "internal/users/repository/postgres/sqlc"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"

  - engine: "postgresql"
    queries: "internal/auth/repository/queries.sql"
    schema: "migrations/migrations"
    gen:
      go:
        package: "auth"
        sql_package: "pgx/v5"
        out: "internal/auth/repository/sqlc"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true


 
  