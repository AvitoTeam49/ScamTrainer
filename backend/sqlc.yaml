version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/postgres/chat/queries.sql"
    schema: "migrations/migrations"
    gen:
      go:
        package: "chatsqlc"
        sql_package: "pgx/v5"
        out: "internal/repository/postgres/chat/sqlc"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true

  - engine: "postgresql"
    queries: "internal/repository/postgres/users/queries.sql"
    schema: "migrations/migrations"
    gen:
      go:
        package: "userssqlc"
        sql_package: "pgx/v5"
        out: "internal/repository/postgres/users/sqlc"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"
